<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Munisam hikoyalari</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  color:white;
  font-family:Arial,sans-serif;

  background-image:
    linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.48)),
    url("./IMG_20260708_133902_971.jpg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;
}

header{
  text-align:center;
  padding:35px 15px 20px;
}

h1{
  margin:0;
  font-size:34px;
  text-shadow:0 2px 8px #000;
}

.subtitle{
  margin-top:8px;
  opacity:.9;
}

.container{
  width:min(900px,94%);
  margin:auto;
  padding-bottom:50px;
}

.panel{
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(8px);
  border-radius:18px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 5px 25px rgba(0,0,0,.3);
}

input,textarea,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:0;
  margin:6px 0;
  font-size:15px;
}

textarea{
  min-height:180px;
  resize:vertical;
}

button{
  cursor:pointer;
  background:white;
  color:#111;
  font-weight:bold;
}

button:hover{
  opacity:.85;
}

.row{
  display:flex;
  gap:8px;
}

.row button{
  flex:1;
}

.story{
  background:rgba(0,0,0,.62);
  border-radius:16px;
  padding:17px;
  margin:12px 0;
}

.story h3{
  margin-top:0;
}

.story-content{
  white-space:pre-wrap;
  line-height:1.6;
}

.small{
  font-size:13px;
  opacity:.75;
}

.hidden{
  display:none!important;
}

.quote{
  text-align:center;
  font-style:italic;
  line-height:1.6;
}

.error{
  color:#ffb3b3;
}

.success{
  color:#b9ffbf;
}

#reader{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.94);
  z-index:20;
  overflow:auto;
  padding:25px 15px;
}

.reader-box{
  max-width:800px;
  margin:auto;
  background:#111;
  border-radius:18px;
  padding:25px;
}

.reader-box h2{
  margin-top:0;
}

#authStatus{
  text-align:center;
}

.lock{
  font-size:22px;
}
</style>
</head>

<body>

<header>
  <h1>Munisam hikoyalari</h1>
  <div class="subtitle">
    Bu yerda mening hikoyalarim yashaydi. ❤️
  </div>
</header>

<div class="container">

  <!-- AUTH -->
  <div class="panel">
    <div id="authStatus">
      <b>Mehmon</b>
      <div class="small">
        Hikoyalarni o‘qish uchun kirish shart emas.
      </div>
    </div>

    <div id="authButtons" class="row">
      <button onclick="showLogin()">Kirish</button>
      <button onclick="showSignup()">Ro‘yxatdan o‘tish</button>
    </div>

    <button id="logoutBtn"
            class="hidden"
            onclick="logout()">
      Chiqish
    </button>
  </div>

  <!-- AUTH FORM -->
  <div id="authForm" class="panel hidden">

    <h3 id="authTitle">Kirish</h3>

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Parol"
    >

    <button onclick="submitAuth()">
      Davom etish
    </button>

    <button onclick="closeAuth()">
      Bekor qilish
    </button>

    <div id="authMessage"></div>

  </div>

  <!-- SEARCH -->
  <div class="panel">
    <input
      id="search"
      type="search"
      placeholder="🔎 Hikoya qidirish..."
      oninput="renderStories()"
    >
  </div>

  <!-- ADD STORY -->
  <div id="writerPanel" class="panel hidden">

    <h3>✍️ Yangi hikoya</h3>

    <input
      id="storyTitle"
      placeholder="Hikoya nomi"
    >

    <textarea
      id="storyContent"
      placeholder="Hikoyangizni yozing..."
    ></textarea>

    <label>
      <input
        id="isPublic"
        type="checkbox"
        style="width:auto"
      >
      Ommaga ko‘rsatish
    </label>

    <input
      id="storyPassword"
      type="password"
      placeholder="Parol (ixtiyoriy)"
    >

    <button onclick="saveStory()">
      💾 Hikoyani saqlash
    </button>

    <button
      id="cancelEditBtn"
      class="hidden"
      onclick="cancelEdit()">
      Bekor qilish
    </button>

    <div id="saveMessage"></div>

  </div>

  <!-- STORIES -->
  <div class="panel">

    <h2>📖 Hikoyalar</h2>

    <div id="stories">
      Yuklanmoqda...
    </div>

  </div>

  <!-- QUOTE -->
  <div class="panel quote">
    <h2>💭 Iqtibos</h2>
    <p>
      “Ba’zi odamlar ketmaydi,
      shunchaki hayotingda o‘rnini yo‘qotadi.”
    </p>
  </div>

</div>

<!-- READER -->
<div id="reader" class="hidden">

  <div class="reader-box">

    <button onclick="closeReader()">
      ✕ Yopish
    </button>

    <h2 id="readerTitle"></h2>

    <div
      id="readerContent"
      class="story-content">
    </div>

  </div>

</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://xponjbwjrbnonkuyhtzz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DSnyIy3Xp3w_Yn1CwaheXA_Gl6-bFon";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let stories = [];
let editingId = null;
let authMode = "login";


/* =========================
   AUTH UI
========================= */

function showLogin(){

  authMode = "login";

  document.getElementById("authForm")
    .classList.remove("hidden");

  document.getElementById("authTitle")
    .textContent = "Kirish";

  document.getElementById("authMessage")
    .textContent = "";

}

function showSignup(){

  authMode = "signup";

  document.getElementById("authForm")
    .classList.remove("hidden");

  document.getElementById("authTitle")
    .textContent = "Ro‘yxatdan o‘tish";

  document.getElementById("authMessage")
    .textContent = "";

}

function closeAuth(){

  document.getElementById("authForm")
    .classList.add("hidden");

}


/* =========================
   AUTH
========================= */

async function submitAuth(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("authMessage");

  if(!email || !password){

    msg.innerHTML =
      '<p class="error">Email va parolni kiriting.</p>';

    return;
  }

  msg.textContent = "Kutib turing...";

  let result;

  if(authMode === "signup"){

    result =
      await supabaseClient.auth.signUp({
        email,
        password
      });

  }else{

    result =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

  }

  if(result.error){

    msg.innerHTML =
      '<p class="error">' +
      result.error.message +
      '</p>';

    return;
  }

  if(authMode === "signup"){

    msg.innerHTML =
      '<p class="success">' +
      "Ro‘yxatdan o‘tish muvaffaqiyatli. Emailingizni tasdiqlash kerak bo‘lishi mumkin." +
      '</p>';

  }else{

    closeAuth();

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  async function(event, session){

    currentUser =
      session ? session.user : null;

    updateAuthUI();

    await loadStories();

  }
);


/* =========================
   AUTH UI UPDATE
========================= */

function updateAuthUI(){

  const status =
    document.getElementById("authStatus");

  const buttons =
    document.getElementById("authButtons");

  const logoutButton =
    document.getElementById("logoutBtn");

  const writer =
    document.getElementById("writerPanel");

  if(currentUser){

    status.innerHTML =
      "<b>👤 " +
      escapeHtml(currentUser.email || "Foydalanuvchi") +
      "</b>" +
      '<div class="small">Kirish amalga oshirildi.</div>';

    buttons.classList.add("hidden");

    logoutButton.classList.remove("hidden");

    writer.classList.remove("hidden");

  }else{

    status.innerHTML =
      "<b>Mehmon</b>" +
      '<div class="small">Hikoyalarni o‘qish uchun kirish shart emas.</div>';

    buttons.classList.remove("hidden");

    logoutButton.classList.add("hidden");

    writer.classList.add("hidden");

  }

}


/* =========================
   LOAD STORIES
========================= */

async function loadStories(){

  let result;

  if(currentUser){

    result =
      await supabaseClient
        .from("stories")
        .select("*")
        .order("created_at", {
          ascending:false
        });

  }else{

    result =
      await supabaseClient
        .from("public_stories")
        .select("*")
        .order("created_at", {
          ascending:false
        });

  }

  if(result.error){

    console.error(result.error);

    stories = [];

    document.getElementById("stories").innerHTML =
      '<p class="error">' +
      "Hikoyalarni yuklashda xatolik yuz berdi." +
      "</p>";

    return;

  }

  stories = result.data || [];

  renderStories();

}


/* =========================
   RENDER
========================= */

function renderStories(){

  const box =
    document.getElementById("stories");

  const search =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  let list =
     [];

  if(search){

    list =
      stories.filter(function(story){

        return (
          (story.title || "")
            .toLowerCase()
            .includes(search)
          ||
          (story.content || "")
            .toLowerCase()
            .includes(search)
        );

      });

  }else{

    list = stories;

  }

  if(!list.length){

    box.innerHTML =
      '<p class="small">Hozircha hikoya yo‘q.</p>';

    return;

  }

  box.innerHTML =
    list.map(function(story){

      const locked =
        story.story_password_hash ||
        story.is_password_protected;

      return `
        <div class="story">

          <h3>
            ${locked ? "🔐 " : ""}
            ${escapeHtml(story.title || "Nomsiz hikoya")}
          </h3>

          <div class="small">
            ${story.created_at
              ? new Date(story.created_at)
                  .toLocaleString("uz-UZ")
              : ""}
          </div>

          ${
            locked
            ?
            `<p>🔐 Bu hikoya parol bilan himoyalangan.</p>`
            :
            `<div class="story-content">
              ${escapeHtml(story.content || "")}
            </div>`
          }

          <div class="row">

            <button
              onclick="openStory(${JSON.stringify(story).replace(/"/g,'&quot;')})">
              📖 O‘qish
            </button>

            ${
              currentUser
              ?
              `
              <button
                onclick="editStory(${JSON.stringify(story).replace(/"/g,'&quot;')})">
                ✏️
              </button>

              <button
                onclick="deleteStory(${JSON.stringify(story).replace(/"/g,'&quot;')})">
                🗑
              </button>
              `
              :
              ""
            }

          </div>

        </div>
      `;

    }).join("");

}


/* =========================
   NEW STORY
========================= */

function newStory(){

  editingId = null;

  document.getElementById("storyTitle").value = "";
  document.getElementById("storyContent").value = "";
  document.getElementById("storyPassword").value = "";
  document.getElementById("isPublic").checked = false;

  document.getElementById("cancelEditBtn")
    .classList.add("hidden");

  document.getElementById("saveMessage")
    .textContent = "";

}


/* =========================
   SAVE STORY
========================= */

async function saveStory(){

  if(!currentUser){

    alert("Avval akkauntga kiring.");

    return;

  }

  const title =
    document.getElementById("storyTitle")
      .value.trim();

  const content =
    document.getElementById("storyContent")
      .value.trim();

  const isPublic =
    document.getElementById("isPublic")
      .checked;

  const password =
    document.getElementById("storyPassword")
      .value;

  const msg =
    document.getElementById("saveMessage");

  if(!title || !content){

    msg.innerHTML =
      '<p class="error">Hikoya nomi va matnini kiriting.</p>';

    return;

  }

  msg.textContent = "Saqlanmoqda...";

  let passwordHash = null;

  if(password){

    const hashResult =
      await supabaseClient.rpc(
        "make_story_password_hash",
        {
          p_password: password
        }
      );

    if(hashResult.error){

      msg.innerHTML =
        '<p class="error">' +
        hashResult.error.message +
        '</p>';

      return;

    }

    passwordHash = hashResult.data;

  }

  let result;

  if(editingId){

    result =
      await supabaseClient
        .from("stories")
        .update({
          title: title,
          content: content,
          is_public: isPublic,
          story_password_hash: passwordHash
        })
        .eq("id", editingId)
        .eq("owner_id", currentUser.id);

  }else{

    result =
      await supabaseClient
        .from("stories")
        .insert({
          title: title,
          content: content,
          owner_id: currentUser.id,
          is_public: isPublic,
          story_password_hash: passwordHash
        });

  }

  if(result.error){

    msg.innerHTML =
      '<p class="error">' +
      result.error.message +
      '</p>';

    return;

  }

  msg.innerHTML =
    '<p class="success">✅ Hikoya saqlandi.</p>';

  newStory();

  await loadStories();

}


/* =========================
   EDIT
========================= */

function editStory(story){

  editingId = story.id;

  document.getElementById("storyTitle").value =
    story.title || "";

  document.getElementById("storyContent").value =
    story.content || "";

  document.getElementById("isPublic").checked =
    !!story.is_public;

  document.getElementById("storyPassword").value = "";

  document.getElementById("cancelEditBtn")
    .classList.remove("hidden");

  document.getElementById("writerPanel")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  newStory();

}


/* =========================
   DELETE
========================= */

async function deleteStory(story){

  if(!currentUser){

    return;

  }

  if(!confirm(
    "Bu hikoyani o‘chirmoqchimisiz?"
  )){

    return;

  }

  const result =
    await supabaseClient
      .from("stories")
      .delete()
      .eq("id", story.id);

  if(result.error){

    alert(
      "O‘chirishda xatolik: " +
      result.error.message
    );

    return;

  }

  await loadStories();

}


/* =========================
   OPEN STORY
========================= */

async function openStory(story){

  if(
    story.is_password_protected ||
    story.story_password_hash
  ){

    const password =
      prompt("🔐 Hikoya parolini kiriting:");

    if(password === null){

      return;

    }

    if(!story.share_token){

      alert(
        "Bu hikoyaga ulashish tokeni mavjud emas."
      );

      return;

    }

    const result =
      await supabaseClient.rpc(
        "verify_story_password",
        {
          p_token: story.share_token,
          p_password: password
        }
      );

    if(result.error){

      alert(
        "Xatolik: " +
        result.error.message
      );

      return;

    }

    if(!result.data || !result.data.length){

      alert("❌ Parol noto‘g‘ri.");

      return;

    }

    showReader(result.data[0]);

    return;

  }

  showReader(story);

}


/* =========================
   READER
========================= */

function showReader(story){

  document.getElementById("readerTitle")
    .textContent =
      story.title || "Nomsiz hikoya";

  document.getElementById("readerContent")
    .textContent =
      story.content || "";

  document.getElementById("reader")
    .classList.remove("hidden");

}


/* =========================
   CLOSE READER
========================= */

function closeReader(){

  document.getElementById("reader")
    .classList.add("hidden");

}


/* =========================
   SHARED STORY
========================= */

async function openSharedStory(token){

  if(!token){

    return;

  }

  const result =
    await supabaseClient.rpc(
      "get_public_story",
      {
        p_token: token
      }
    );

  if(result.error){

    console.error(result.error);

    return;

  }

  if(!result.data || !result.data.length){

    return;

  }

  openStory(result.data[0]);

}


/* =========================
   LINK CHECK
========================= */

function openStoryFromLink(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("story");

  if(token){

    openSharedStory(token);

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

async function checkUser(){

  const result =
    await supabaseClient.auth.getSession();

  currentUser =
    result.data.session
      ? result.data.session.user
      : null;

  updateAuthUI();

  await loadStories();

  openStoryFromLink();

}


/* =========================
   START APP
========================= */

checkUser();

</script>

</body>
</html>
