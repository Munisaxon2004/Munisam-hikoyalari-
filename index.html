<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Munisam hikoyalari</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:#fff;
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.65)),
    url("IMG_20260708_133902_971.jpg") center/cover fixed;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1100px,94%);
  margin:auto;
}

header{
  padding:25px 0 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  opacity:.85;
}

.card{
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  padding:18px;
  margin:15px 0;
  backdrop-filter:blur(8px);
}

input,
textarea{
  width:100%;
  border:0;
  outline:none;
  border-radius:12px;
  padding:12px;
  margin:6px 0;
  background:rgba(255,255,255,.92);
  color:#111;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:0;
  border-radius:12px;
  padding:10px 15px;
  margin:4px;
  background:#fff;
  color:#111;
  font-weight:bold;
}

button:hover{
  opacity:.85;
}

.danger{
  background:#b91c1c;
  color:#fff;
}

.green{
  background:#15803d;
  color:#fff;
}

.dark{
  background:#222;
  color:#fff;
}

.hidden{
  display:none!important;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.story{
  background:rgba(255,255,255,.09);
  border-radius:15px;
  padding:15px;
  margin:10px 0;
}

.story h3{
  margin-top:0;
}

.meta{
  font-size:13px;
  opacity:.7;
}

.media{
  max-width:100%;
  max-height:400px;
  border-radius:12px;
  margin-top:10px;
}

video,
audio{
  width:100%;
  margin-top:10px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#171717;
  border-radius:18px;
  padding:20px;
}

.reader-content{
  white-space:pre-wrap;
  line-height:1.7;
}

.small{
  font-size:13px;
  opacity:.8;
}

label{
  display:block;
  margin-top:10px;
  font-weight:bold;
}

hr{
  border:0;
  border-top:1px solid rgba(255,255,255,.15);
  margin:18px 0;
}

#status{
  text-align:center;
  min-height:20px;
  margin:8px;
}

.media-link{
  display:block;
  word-break:break-all;
  font-size:12px;
  opacity:.8;
  margin:5px 0;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🌙 Munisam hikoyalari</h1>
  <p>Hikoyalarim, iqtiboslarim va xotiralarim</p>
</header>

<div id="status"></div>

<div id="authSection" class="card">

  <h2>🔐 Kirish</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Parol">

  <div class="row">
    <button onclick="login()">Kirish</button>
    <button onclick="register()">Ro‘yxatdan o‘tish</button>
    <button class="dark" onclick="forgotPassword()">Parolni unutdim</button>
  </div>

</div>

<div id="userSection" class="card hidden">

  <div class="row">
    <strong id="userEmail"></strong>
    <button class="dark" onclick="logout()">Chiqish</button>
  </div>

</div>

<div id="mainSection" class="hidden">

  <div class="card">

    <div class="row">
      <button class="green" onclick="newStory()">➕ Yangi hikoya</button>
      <button onclick="showQuotes()">💬 Iqtiboslar</button>
      <button onclick="loadStories()">🔄 Yangilash</button>
    </div>

    <input
      id="search"
      placeholder="🔎 Hikoya qidirish..."
      oninput="renderStories()"
    >

  </div>

  <div id="storyEditor" class="card hidden">

    <h2 id="editorTitle">✍️ Yangi hikoya</h2>

    <input id="storyTitle" placeholder="Hikoya nomi">

    <textarea
      id="storyContent"
      placeholder="Hikoyangizni yozing..."
    ></textarea>

    <label>
      <input
        id="isPublic"
        type="checkbox"
        style="width:auto"
      >
      Hammaga ko‘rinsin
    </label>

    <label>
      Hikoya paroli (ixtiyoriy)
    </label>

    <input
      id="storyPassword"
      type="password"
      placeholder="Parol qo‘ying"
    >

    <hr>

    <h3>🖼 Rasm</h3>
    <input
      id="imageFile"
      type="file"
      accept="image/*"
      onchange="showFileName('imageFile','imageName')"
    >
    <div id="imageName" class="small"></div>

    <h3>🎬 Video</h3>
    <input
      id="videoFile"
      type="file"
      accept="video/*"
      onchange="showFileName('videoFile','videoName')"
    >
    <div id="videoName" class="small"></div>

    <h3>🎵 Audio</h3>
    <input
      id="audioFile"
      type="file"
      accept="audio/*"
      onchange="showFileName('audioFile','audioName')"
    >
    <div id="audioName" class="small"></div>

    <h3>🎙 Ovoz yozish</h3>

    <div class="row">
      <button
        id="startVoiceBtn"
        onclick="startRecording()"
      >
        🎙 Boshlash
      </button>

      <button
        id="stopVoiceBtn"
        class="danger hidden"
        onclick="stopRecording()"
      >
        ⏹ To‘xtatish
      </button>
    </div>

    <div id="recordStatus" class="small"></div>

    <div class="row">
      <button class="green" onclick="saveStory()">💾 Saqlash</button>
      <button class="dark" onclick="cancelEdit()">Bekor qilish</button>
    </div>

  </div>

  <div id="stories"></div>

</div>

</div>

<!-- LOGIN/REGISTER RECOVERY -->

<div id="recoveryModal" class="modal hidden">

  <div class="modal-box">

    <h2>🔑 Yangi parol</h2>

    <input
      id="newPassword"
      type="password"
      placeholder="Yangi parol"
    >

    <button class="green" onclick="changePassword()">
      Parolni almashtirish
    </button>

    <button class="dark" onclick="closeRecovery()">
      Yopish
    </button>

  </div>

</div>

<!-- STORY PASSWORD -->

<div id="storyPasswordModal" class="modal hidden">

  <div class="modal-box">

    <h2>🔒 Hikoya parol bilan himoyalangan</h2>

    <input
      id="readerPassword"
      type="password"
      placeholder="Hikoya parolini kiriting"
    >

    <button
      class="green"
      onclick="verifyReaderPassword()"
    >
      Ochish
    </button>

    <button
      class="dark"
      onclick="closeStoryPassword()"
    >
      Bekor qilish
    </button>

  </div>

</div>

<!-- READER -->

<div id="readerModal" class="modal hidden">

  <div class="modal-box">

    <div class="row">
      <button class="dark" onclick="closeReader()">✕ Yopish</button>
    </div>

    <h2 id="readerTitle"></h2>

    <div id="readerDate" class="meta"></div>

    <hr>

    <div id="readerContent" class="reader-content"></div>

    <div id="readerMedia"></div>

  </div>

</div>

<!-- MEDIA ONLY -->

<div id="mediaModal" class="modal hidden">

  <div class="modal-box">

    <button class="dark" onclick="closeMedia()">✕ Yopish</button>

    <h2 id="mediaTitle"></h2>
    <div id="mediaDate" class="meta"></div>

    <div id="mediaOnlyContent"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://xponjbwjrbnonkuyhtzz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_DSnyIy3Xp3w_Yn1CwaheXA_Gl6-bFon";

const ADMIN_ID =
  "d83107c5-ac1a-49bf-a53d-7fe17f39f15b";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        flowType:"pkce"
      }
    }
  );

let currentUser = null;
let stories = [];
let editingId = null;

let uploadedImage = null;
let uploadedVideo = null;
let uploadedAudio = null;
let uploadedVoice = null;

let mediaRecorder = null;
let recordedChunks = [];

let pendingStory = null;

function status(message){
  document.getElementById("status").textContent =
    message || "";
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){
  if(!date) return "";

  return new Date(date).toLocaleString(
    "uz-UZ",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}

function randomToken(){
  if(window.crypto?.randomUUID){
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );
}

function getSiteUrl(){
  return window.location.origin +
    window.location.pathname;
}async function register(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    status("Email va parolni kiriting.");
    return;
  }

  if(password.length < 6){
    status("Parol kamida 6 ta belgidan iborat bo‘lsin.");
    return;
  }

  status("Ro‘yxatdan o‘tilmoqda...");

  const {error} =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if(error){
    status(error.message);
    return;
  }

  status(
    "Ro‘yxatdan o‘tildi. Emailingizni tasdiqlash kerak bo‘lishi mumkin."
  );
}


async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if(!email || !password){
    status("Email va parolni kiriting.");
    return;
  }

  status("Kirilmoqda...");

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    status(error.message);
    return;
  }

  currentUser = data.user || null;

  updateAuthUI();
  await loadStories();

  status("Xush kelibsiz ❤️");
}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  stories = [];

  updateAuthUI();

  document.getElementById("stories").innerHTML = "";

  status("Hisobdan chiqildi.");
}


async function forgotPassword(){

  const email =
    document.getElementById("email").value.trim();

  if(!email){
    status("Avval emailni yozing.");
    return;
  }

  const {error} =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo:getSiteUrl()
      }
    );

  if(error){
    status(error.message);
    return;
  }

  status(
    "Parolni tiklash havolasi emailingizga yuborildi."
  );
}


async function changePassword(){

  const password =
    document.getElementById("newPassword").value;

  if(password.length < 6){
    status(
      "Yangi parol kamida 6 ta belgidan iborat bo‘lsin."
    );
    return;
  }

  const {error} =
    await supabaseClient.auth.updateUser({
      password
    });

  if(error){
    status(error.message);
    return;
  }

  document
    .getElementById("recoveryModal")
    .classList.add("hidden");

  status("Parol muvaffaqiyatli almashtirildi.");
}


function closeRecovery(){

  document
    .getElementById("recoveryModal")
    .classList.add("hidden");
}


function updateAuthUI(){

  const auth =
    document.getElementById("authSection");

  const user =
    document.getElementById("userSection");

  const main =
    document.getElementById("mainSection");

  if(currentUser){

    auth.classList.add("hidden");
    user.classList.remove("hidden");
    main.classList.remove("hidden");

    document.getElementById("userEmail")
      .textContent =
      currentUser.email || "";

  }else{

    auth.classList.remove("hidden");
    user.classList.add("hidden");
    main.classList.add("hidden");
  }
}


async function loadStories(){

  if(!currentUser){
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("stories")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){
    status(error.message);
    return;
  }

  stories = data || [];

  renderStories();
}


function renderStories(){

  const box =
    document.getElementById("stories");

  if(!currentUser){
    box.innerHTML = "";
    return;
  }

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const admin =
    currentUser.id === ADMIN_ID;

  const filtered =
    stories.filter(story => {

      const text =
        (
          story.title +
          " " +
          (story.content || "")
        ).toLowerCase();

      return text.includes(query);
    });

  if(!filtered.length){

    box.innerHTML = `
      <div class="card">
        Hozircha hikoya topilmadi.
      </div>
    `;

    return;
  }

  box.innerHTML =
    filtered.map(story => {

      const owner =
        story.owner_id === currentUser.id;

      const canManage =
        owner || admin;

      let media = "";

      if(story.image_path){
        media += "🖼 Rasm ";
      }

      if(story.video_path){
        media += "🎬 Video ";
      }

      if(story.audio_path){
        media += "🎵 Audio ";
      }

      if(story.voice_path){
        media += "🎙 Ovoz ";
      }

      return `
        <div class="story">

          <h3>
            ${escapeHtml(story.title || "Nomsiz hikoya")}
          </h3>

          <div class="meta">
            ${formatDate(story.created_at)}
          </div>

          <p>
            ${escapeHtml(
              (story.content || "").slice(0,250)
            )}
            ${
              (story.content || "").length > 250
              ? "..."
              : ""
            }
          </p>

          <div class="small">
            ${
              story.is_public
              ? "🌍 Ommaviy"
              : "🔐 Shaxsiy"
            }

            ${
              story.story_password_hash
              ? " · 🔒 Parolli"
              : ""
            }

            ${
              media
              ? " · " + media
              : ""
            }
          </div>

          <div class="row">

            <button
              onclick="openStoryById('${story.id}')"
            >
              📖 O‘qish
            </button>

            ${
              canManage
              ? `
                <button
                  onclick="editStory('${story.id}')"
                >
                  ✏️ Tahrirlash
                </button>

                <button
                  class="danger"
                  onclick="deleteStory('${story.id}')"
                >
                  🗑 O‘chirish
                </button>
              `
              : ""
            }

            ${
              story.is_public && story.share_token
              ? `
                <button
                  onclick="copyStoryLink('${story.share_token}')"
                >
                  🔗 Hikoya linki
                </button>
              `
              : ""
            }

          </div>

          ${
            story.share_token
            ? getMediaButtons(story)
            : ""
          }

        </div>
      `;

    }).join("");
}


function getMediaButtons(story){

  let html = "";

  const types = [
    ["image_path","🖼 Rasm","image"],
    ["video_path","🎬 Video","video"],
    ["audio_path","🎵 Audio","audio"],
    ["voice_path","🎙 Ovoz","voice"]
  ];

  types.forEach(item => {

    const path = story[item[0]];

    if(path && story.share_token){

      html += `
        <button
          onclick="copyMediaLink(
            '${story.share_token}',
            '${item[2]}'
          )"
        >
          ${item[1]} link
        </button>
      `;
    }
  });

  return html;
}


function newStory(){

  editingId = null;

  uploadedImage = null;
  uploadedVideo = null;
  uploadedAudio = null;
  uploadedVoice = null;

  document.getElementById("editorTitle")
    .textContent = "✍️ Yangi hikoya";

  document.getElementById("storyTitle").value = "";
  document.getElementById("storyContent").value = "";
  document.getElementById("storyPassword").value = "";
  document.getElementById("isPublic").checked = false;

  document.getElementById("imageFile").value = "";
  document.getElementById("videoFile").value = "";
  document.getElementById("audioFile").value = "";

  document.getElementById("imageName").textContent = "";
  document.getElementById("videoName").textContent = "";
  document.getElementById("audioName").textContent = "";
  document.getElementById("recordStatus").textContent = "";

  document.getElementById("storyEditor")
    .classList.remove("hidden");
}


function cancelEdit(){

  editingId = null;

  document.getElementById("storyEditor")
    .classList.add("hidden");
}


function showFileName(inputId,outputId){

  const file =
    document.getElementById(inputId)
      .files[0];

  document.getElementById(outputId)
    .textContent =
    file ? file.name : "";
}


function getExtension(name,fallback){

  const parts =
    name.split(".");

  if(parts.length < 2){
    return fallback;
  }

  return parts.pop()
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"") ||
    fallback;
}


async function uploadBlob(
  blob,
  folder,
  extension
){

  if(!currentUser){
    throw new Error("Avval tizimga kiring.");
  }

  const fileName =
    `${currentUser.id}/${folder}_${Date.now()}.${extension}`;

  const {error} =
    await supabaseClient
      .storage
      .from("story-media")
      .upload(
        fileName,
        blob,
        {
          upsert:false,
          contentType:blob.type || undefined
        }
      );

  if(error){
    throw error;
  }

  return fileName;
}


async function uploadMedia(){

  const image =
    document.getElementById("imageFile")
      .files[0];

  const video =
    document.getElementById("videoFile")
      .files[0];

  const audio =
    document.getElementById("audioFile")
      .files[0];

  if(image){
    uploadedImage =
      await uploadBlob(
        image,
        "image",
        getExtension(image.name,"jpg")
      );
  }

  if(video){
    uploadedVideo =
      await uploadBlob(
        video,
        "video",
        getExtension(video.name,"mp4")
      );
  }

  if(audio){
    uploadedAudio =
      await uploadBlob(
        audio,
        "audio",
        getExtension(audio.name,"mp3")
      );
  }
}


function getMediaUrl(path){

  if(!path){
    return null;
  }

  const {data} =
    supabaseClient
      .storage
      .from("story-media")
      .getPublicUrl(path);

  return data.publicUrl;
  }async function startRecording(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    status("Telefon brauzeri mikrofonni qo‘llab-quvvatlamaydi.");
    return;
  }

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    recordedChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      event => {

        if(event.data.size > 0){
          recordedChunks.push(event.data);
        }
      };

    mediaRecorder.onstop =
      async () => {

        const blob =
          new Blob(
            recordedChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );

        try{

          uploadedVoice =
            await uploadBlob(
              blob,
              "voice",
              "webm"
            );

          document.getElementById(
            "recordStatus"
          ).textContent =
            "🎙 Ovoz yozib saqlandi.";

        }catch(error){

          document.getElementById(
            "recordStatus"
          ).textContent =
            error.message;
        }
      };

    mediaRecorder.start();

    document
      .getElementById("startVoiceBtn")
      .classList.add("hidden");

    document
      .getElementById("stopVoiceBtn")
      .classList.remove("hidden");

    document.getElementById(
      "recordStatus"
    ).textContent =
      "🔴 Ovoz yozilmoqda...";

  }catch(error){

    status("Mikrofonga ruxsat berilmadi.");
  }
}


function stopRecording(){

  if(!mediaRecorder){
    return;
  }

  if(mediaRecorder.state !== "inactive"){
    mediaRecorder.stop();
  }

  if(mediaRecorder.stream){

    mediaRecorder.stream
      .getTracks()
      .forEach(track => track.stop());
  }

  document
    .getElementById("startVoiceBtn")
    .classList.remove("hidden");

  document
    .getElementById("stopVoiceBtn")
    .classList.add("hidden");
}


async function makePasswordHash(password){

  if(!password){
    return null;
  }

  const {data,error} =
    await supabaseClient.rpc(
      "hash_story_password",
      {
        p_password:password
      }
    );

  if(error){
    throw error;
  }

  return data;
}


async function saveStory(){

  if(!currentUser){
    status("Avval tizimga kiring.");
    return;
  }

  const title =
    document.getElementById("storyTitle")
      .value.trim();

  const content =
    document.getElementById("storyContent")
      .value.trim();

  const isPublic =
    document.getElementById("isPublic")
      .checked;

  const password =
    document.getElementById("storyPassword")
      .value;

  if(!title){
    status("Hikoya nomini yozing.");
    return;
  }

  if(!content){
    status("Hikoya matnini yozing.");
    return;
  }

  try{

    status("Saqlanmoqda...");

    await uploadMedia();

    let passwordHash = null;

    if(password){
      passwordHash =
        await makePasswordHash(password);
    }

    if(editingId){

      const oldStory =
        stories.find(
          s => s.id === editingId
        );

      const updateData = {

        title,
        content,
        is_public:isPublic,

        image_path:
          uploadedImage !== null
          ? uploadedImage
          : oldStory?.image_path || null,

        video_path:
          uploadedVideo !== null
          ? uploadedVideo
          : oldStory?.video_path || null,

        audio_path:
          uploadedAudio !== null
          ? uploadedAudio
          : oldStory?.audio_path || null,

        voice_path:
          uploadedVoice !== null
          ? uploadedVoice
          : oldStory?.voice_path || null
      };

      if(password){
        updateData.story_password_hash =
          passwordHash;
      }

      const {error} =
        await supabaseClient
          .from("stories")
          .update(updateData)
          .eq("id",editingId);

      if(error){
        throw error;
      }

      status("Hikoya yangilandi.");

    }else{

      const shareToken =
        randomToken();

      const {error} =
        await supabaseClient
          .from("stories")
          .insert({

            title,
            content,

            owner_id:
              currentUser.id,

            is_public:
              isPublic,

            share_token:
              shareToken,

            story_password_hash:
              passwordHash,

            image_path:
              uploadedImage,

            video_path:
              uploadedVideo,

            audio_path:
              uploadedAudio,

            voice_path:
              uploadedVoice
          });

      if(error){
        throw error;
      }

      status("Hikoya saqlandi ❤️");
    }

    editingId = null;

    document
      .getElementById("storyEditor")
      .classList.add("hidden");

    await loadStories();

  }catch(error){

    console.error(error);

    status(
      "Xatolik: " +
      (error.message || error)
    );
  }
}


function editStory(id){

  const story =
    stories.find(s => s.id === id);

  if(!story){
    return;
  }

  const owner =
    story.owner_id === currentUser.id;

  const admin =
    currentUser.id === ADMIN_ID;

  if(!owner && !admin){

    status(
      "Bu hikoyani tahrirlash huquqingiz yo‘q."
    );

    return;
  }

  editingId = id;

  uploadedImage = null;
  uploadedVideo = null;
  uploadedAudio = null;
  uploadedVoice = null;

  document.getElementById("editorTitle")
    .textContent =
    "✏️ Hikoyani tahrirlash";

  document.getElementById("storyTitle")
    .value =
    story.title || "";

  document.getElementById("storyContent")
    .value =
    story.content || "";

  document.getElementById("isPublic")
    .checked =
    !!story.is_public;

  document.getElementById("storyPassword")
    .value = "";

  showExistingMedia(story);

  document.getElementById("storyEditor")
    .classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function showExistingMedia(story){

  let html = "";

  if(story.image_path){
    html += `
      <div class="small">
        🖼 Hozirgi rasm mavjud.
      </div>
    `;
  }

  if(story.video_path){
    html += `
      <div class="small">
        🎬 Hozirgi video mavjud.
      </div>
    `;
  }

  if(story.audio_path){
    html += `
      <div class="small">
        🎵 Hozirgi audio mavjud.
      </div>
    `;
  }

  if(story.voice_path){
    html += `
      <div class="small">
        🎙 Hozirgi ovoz mavjud.
      </div>
    `;
  }

  document.getElementById("recordStatus")
    .innerHTML = html;
}


async function deleteStory(id){

  const story =
    stories.find(s => s.id === id);

  if(!story){
    return;
  }

  const owner =
    story.owner_id === currentUser.id;

  const admin =
    currentUser.id === ADMIN_ID;

  if(!owner && !admin){

    status(
      "Bu hikoyani o‘chirish huquqingiz yo‘q."
    );

    return;
  }

  if(!confirm(
    "Bu hikoyani butunlay o‘chirmoqchimisiz?"
  )){
    return;
  }

  const paths = [
    story.image_path,
    story.video_path,
    story.audio_path,
    story.voice_path
  ].filter(Boolean);

  if(paths.length){

    await supabaseClient
      .storage
      .from("story-media")
      .remove(paths);
  }

  const {error} =
    await supabaseClient
      .from("stories")
      .delete()
      .eq("id",id);

  if(error){

    status(error.message);
    return;
  }

  status("Hikoya o‘chirildi.");

  await loadStories();
}


function openStoryById(id){

  const story =
    stories.find(s => s.id === id);

  if(!story){
    return;
  }

  openStory(story);
}


async function openStory(story){

  const locked =
    story.story_password_hash ||
    story.story_password;

  if(!locked){

    showReader(
      story.title,
      story.content,
      story.created_at,
      story.image_path,
      story.video_path,
      story.audio_path,
      story.voice_path
    );

    return;
  }

  pendingStory = story;

  document
    .getElementById("readerPassword")
    .value = "";

  document
    .getElementById("storyPasswordModal")
    .classList.remove("hidden");
}


function closeStoryPassword(){

  pendingStory = null;

  document
    .getElementById("storyPasswordModal")
    .classList.add("hidden");
}


async function verifyReaderPassword(){

  if(!pendingStory){
    return;
  }

  const password =
    document.getElementById("readerPassword")
      .value;

  if(!password){
    status("Parolni kiriting.");
    return;
  }

  status("Tekshirilmoqda...");

  const {data,error} =
    await supabaseClient.rpc(
      "verify_story_password",
      {
        p_token:
          pendingStory.share_token,

        p_password:
          password
      }
    );

  if(error){

    status(error.message);
    return;
  }

  if(!data || !data.length){

    status("Parol noto‘g‘ri.");
    return;
  }

  const story = data[0];

  closeStoryPassword();

  showReader(
    story.title,
    story.content,
    story.created_at,
    story.image_path,
    story.video_path,
    story.audio_path,
    story.voice_path
  );
}


function showReader(
  title,
  content,
  createdAt,
  imagePath,
  videoPath,
  audioPath,
  voicePath
){

  document.getElementById("readerTitle")
    .textContent =
    title || "Hikoya";

  document.getElementById("readerDate")
    .textContent =
    formatDate(createdAt);

  document.getElementById("readerContent")
    .textContent =
    content || "";

  let media = "";

  if(imagePath){

    const url =
      getMediaUrl(imagePath);

    media += `
      <h3>🖼 Rasm</h3>

      <img
        class="media"
        src="${url}"
        alt="Hikoya rasmi"
      >
    `;
  }

  if(videoPath){

    const url =
      getMediaUrl(videoPath);

    media += `
      <h3>🎬 Video</h3>

      <video
        class="media"
        src="${url}"
        controls
      ></video>
    `;
  }

  if(audioPath){

    const url =
      getMediaUrl(audioPath);

    media += `
      <h3>🎵 Audio</h3>

      <audio
        src="${url}"
        controls
      ></audio>
    `;
  }

  if(voicePath){

    const url =
      getMediaUrl(voicePath);

    media += `
      <h3>🎙 Ovoz</h3>

      <audio
        src="${url}"
        controls
      ></audio>
    `;
  }

  document.getElementById("readerMedia")
    .innerHTML = media;

  document
    .getElementById("readerModal")
    .classList.remove("hidden");
}


function closeReader(){

  document
    .getElementById("readerModal")
    .classList.add("hidden");

  const link =
    getSiteUrl() +
    "?media=" +
    encodeURIComponent(token) +

  navigator.clipboard.writeText(link)
    .then(() => alert("Media havolasi nusxalandi!"))
    .catch(() => prompt("Havolani nusxalang:", link));
}


function isMediaRoute(){

  const params =
    new URLSearchParams(window.location.search);

  return params.has("media");
}


function isStoryRoute(){

  const params =
    new URLSearchParams(window.location.search);

  return params.has("story");
}


async function openStoryFromLink(){

  const params =
    new URLSearchParams(window.location.search);

  const token =
    params.get("story");

  if(!token) return;

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("mainSection")
    .classList.add("hidden");

  const {data,error} =
    await supabaseClient
      .rpc("get_public_story",{
        p_token: token
      });

  if(error){

    alert("Hikoyani ochishda xatolik yuz berdi.");

    console.error(error);

    return;
  }

  if(!data || !data.length){

    alert("Bunday hikoya topilmadi yoki u ommaga ochiq emas.");

    return;
  }

  const story = data[0];

  if(story.is_password_protected){

    pendingStory = story;

    document
      .getElementById("readerPasswordModal")
      .classList.remove("hidden");

    return;
  }

  showReader(story);
}


async function openMediaFromLink(){

  const params =
    new URLSearchParams(window.location.search);

  const token =
    params.get("media");

  const type =
    params.get("type");

  if(!token) return;

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("mainSection")
    .classList.add("hidden");

  const {data,error} =
    await supabaseClient
      .rpc("get_public_story",{
        p_token: token
      });

  if(error){

    alert("Media faylni ochishda xatolik yuz berdi.");

    console.error(error);

    return;
  }

  if(!data || !data.length){

    alert("Media topilmadi yoki u ommaga ochiq emas.");

    return;
  }

  const story = data[0];

  if(story.is_password_protected){

    pendingStory = story;

    document
      .getElementById("readerPasswordModal")
      .classList.remove("hidden");

    return;
  }

  showOnlyMedia(story,type);
}


function showOnlyMedia(story,type){

  let path = null;
  let mediaHTML = "";

  if(type === "image"){
    path = story.image_path;

    if(path){

      const url =
        supabaseClient.storage
          .from("story-media")
          .getPublicUrl(path)
          .data.publicUrl;

      mediaHTML =
        `<img src="${url}"
          style="max-width:100%;max-height:70vh;border-radius:15px;">`;
    }
  }

  else if(type === "video"){
    path = story.video_path;

    if(path){

      const url =
        supabaseClient.storage
          .from("story-media")
          .getPublicUrl(path)
          .data.publicUrl;

      mediaHTML =
        `<video controls
          style="max-width:100%;max-height:70vh;border-radius:15px;">
          <source src="${url}">
        </video>`;
    }
  }

  else if(type === "audio"){
    path = story.audio_path;

    if(path){

      const url =
        supabaseClient.storage
          .from("story-media")
          .getPublicUrl(path)
          .data.publicUrl;

      mediaHTML =
        `<audio controls style="width:100%;">
          <source src="${url}">
        </audio>`;
    }
  }

  else if(type === "voice"){
    path = story.voice_path;

    if(path){

      const url =
        supabaseClient.storage
          .from("story-media")
          .getPublicUrl(path)
          .data.publicUrl;

      mediaHTML =
        `<audio controls style="width:100%;">
          <source src="${url}">
        </audio>`;
    }
  }

  if(!mediaHTML){

    alert("Bu turdagi media topilmadi.");

    return;
  }

  const box =
    document.createElement("div");

  box.id = "singleMediaPage";

  box.style.cssText = `
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.92);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    overflow:auto;
    color:white;
  `;

  box.innerHTML = `

    <div style="
      width:100%;
      max-width:800px;
      text-align:center;
    ">

      <h2 style="margin-bottom:8px;">
        ${escapeHtml(story.title || "Media")}
      </h2>

      <div style="
        opacity:.75;
        margin-bottom:25px;
      ">
        ${new Date(story.created_at).toLocaleDateString("uz-UZ")}
      </div>

      ${mediaHTML}

      <button
        onclick="closeMedia()"
        style="
          margin-top:25px;
          padding:12px 25px;
          border:none;
          border-radius:12px;
          cursor:pointer;
        "
      >
        ✕ Yopish
      </button>

    </div>
  `;

  document.body.appendChild(box);
}


function closeMedia(){

  const box =
    document.getElementById("singleMediaPage");

  if(box){
    box.remove();
  }
}


function showQuotes(){

  const section =
    document.getElementById("quotesSection");

  if(!section) return;

  section.classList.remove("hidden");

  section.scrollIntoView({
    behavior:"smooth"
  });
}


async function checkUser(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if(isStoryRoute()){

    await openStoryFromLink();

    return;
  }

  if(isMediaRoute()){

    await openMediaFromLink();

    return;
  }

  if(session){

    currentUser =
      session.user;

    document
      .getElementById("authSection")
      .classList.add("hidden");

    document
      .getElementById("mainSection")
      .classList.remove("hidden");

    await loadStories();

  }else{

    currentUser = null;

    document
      .getElementById("authSection")
      .classList.remove("hidden");

    document
      .getElementById("mainSection")
      .classList.add("hidden");
  }
}


supabaseClient.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){

      currentUser =
        session.user;

      if(!isStoryRoute() && !isMediaRoute()){

        document
          .getElementById("authSection")
          .classList.add("hidden");

        document
          .getElementById("mainSection")
          .classList.remove("hidden");

        await loadStories();
      }

    }else{

      currentUser = null;

      if(!isStoryRoute() && !isMediaRoute()){

        document
          .getElementById("authSection")
          .classList.remove("hidden");

        document
          .getElementById("mainSection")
          .classList.add("hidden");
      }
    }
  }
);


window.addEventListener(
  "load",
  checkUser
);

</script>
