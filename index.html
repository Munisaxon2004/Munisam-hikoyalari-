<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munisam hikoyalari</title>

<style>
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:40px 20px;background:#000}
h1{margin:0}
.stories{max-width:700px;margin:auto;padding:25px 20px}
.story,.writer{background:#1d1d1d;border-radius:16px;padding:22px;margin-bottom:18px}
.story p{color:#ddd;line-height:1.8}
button{padding:11px 18px;border:0;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px}
.add{background:white;color:black}
.writer{display:none}
input,textarea{
  width:100%;
  box-sizing:border-box;
  margin:8px 0;
  padding:12px;
  border-radius:10px;
  border:0;
  background:#292929;
  color:white;
}
</style>
</head>

<body>

<header>
<h1>Munisam hikoyalari</h1>
<p>Bu yerda mening hikoyalarim yashaydi.</p>
</header>

<main class="stories">

<button class="add" onclick="showWriter()">＋ Yangi hikoya</button>

<div id="writer" class="writer">
<h2>Yangi hikoya</h2>

<input id="title" placeholder="Hikoya nomi">

<textarea id="text" rows="8" placeholder="Hikoyangizni yozing..."></textarea>

<button onclick="saveStory()">Saqlash</button>
<button onclick="hideWriter()">Bekor qilish</button>
</div>

<div id="stories"></div>

</main>

<script>
function showWriter(){
  document.getElementById("writer").style.display="block";
}

function hideWriter(){
  document.getElementById("writer").style.display="none";
}

function saveStory(){
  let title=document.getElementById("title").value;
  let text=document.getElementById("text").value;

  if(title==="" || text===""){
    alert("Nom va hikoyani yozing!");
    return;
  }

  let story=document.createElement("div");
  story.className="story";
  story.innerHTML="<h2>"+title+"</h2><p>"+text+"</p>";

  document.getElementById("stories").appendChild(story);

  document.getElementById("title").value="";
  document.getElementById("text").value="";
  hideWriter();
}
</script>

</body>
</html>
