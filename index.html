<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Munisam hikoyalari</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;color:#222;
 background:#f5f1ed url("IMG_20260708_133902_971.jpg") center/cover fixed no-repeat;
}
body:before{
 content:"";position:fixed;inset:0;
 background:rgba(255,255,255,.76);z-index:-1;
}
header{
 background:#fffffff0;padding:20px;text-align:center;
 box-shadow:0 2px 12px #0002;
}
header h1{margin:0}
.container{max-width:950px;margin:auto;padding:15px}
.card,.story,.quote{
 background:#fffffff2;border-radius:18px;padding:18px;
 margin:14px 0;box-shadow:0 4px 18px #0002;
}
input,textarea,select{
 width:100%;padding:12px;margin:6px 0;
 border:1px solid #ccc;border-radius:10px;font-size:15px;
}
textarea{min-height:150px}
button{
 border:0;border-radius:10px;padding:10px 14px;
 margin:4px;cursor:pointer;background:#222;color:#fff;
}
button.light{background:#eee;color:#222}
button.secondary{background:#777}
button.danger{background:#a33}
button.green{background:#397047}
button.telegram{background:#168acd}
.row{display:flex;flex-wrap:wrap;gap:5px}
.hidden{display:none!important}
.small{font-size:13px;color:#777}
.status{padding:10px;border-radius:10px;margin:8px 0;background:#eee}
.status.ok{background:#dff2e3}
.status.error{background:#f8dddd}
.media{max-width:100%;width:100%;border-radius:12px;margin-top:10px}
.quote-text{font-size:18px;line-height:1.6;font-style:italic}
.modal{
 position:fixed;inset:0;background:#0008;
 display:flex;align-items:center;justify-content:center;
 padding:15px;z-index:1000;
}
.modal-box{
 background:white;border-radius:18px;padding:20px;
 max-width:850px;width:100%;max-height:90vh;overflow:auto;
}
.close{float:right;background:#eee;color:#222}
label{font-weight:bold;display:block;margin-top:8px}
.progress{
 height:12px;background:#ddd;border-radius:20px;
 overflow:hidden;margin:10px 0;
}
.progress div{
 height:100%;width:0;background:#333;
 transition:width .2s;
}
</style>
</head>

<body>

<header>
<h1>📖 Munisam hikoyalari</h1>
<p>Hikoyalarim, iqtiboslarim va xotiralarim</p>
</header>

<div class="container">

<div id="authSection" class="card">
<h2>🔐 Kirish</h2>
<input id="authEmail" type="email" placeholder="Email">
<input id="authPassword" type="password" placeholder="Parol">

<div class="row">
<button onclick="login()">Kirish</button>
<button onclick="register()">Ro‘yxatdan o‘tish</button>
<button class="light" onclick="forgotPassword()">Parolni unutdingizmi?</button>
</div>

<div id="authStatus"></div>
</div>

<div id="userSection" class="card hidden">
<div id="userInfo"></div>

<div class="row">
<button onclick="newStory()">✍️ Yangi hikoya</button>
<button onclick="showQuotes()">💬 Iqtiboslar</button>
<button class="secondary" onclick="logout()">Chiqish</button>
</div>
</div>

<div id="mainSection" class="hidden">

<div class="card">
<input id="searchInput"
placeholder="🔎 Qidirish..."
oninput="renderStories()">
</div>

<div id="editor" class="card hidden">
<h2 id="editorTitle">✍️ Yangi hikoya</h2>

<label>Sarlavha</label>
<input id="storyTitle" placeholder="Hikoya nomi">

<label>Hikoya matni</label>
<textarea id="storyContent" placeholder="Hikoyangiz..."></textarea>

<label>
<input id="storyPublic" type="checkbox" style="width:auto">
 Ommaga ochiq
</label>

<label>🔐 Hikoya paroli (ixtiyoriy)</label>
<input id="storyPassword" type="password">

<label>🖼 Rasm</label>
<input id="imageFile" type="file" accept="image/*"
onchange="showFileName(this,'imageName')">
<div id="imageName" class="small"></div>

<label>🎬 Video</label>
<input id="videoFile" type="file" accept="video/*"
onchange="showFileName(this,'videoName')">
<div id="videoName" class="small"></div>

<label>🎵 Audio</label>
<input id="audioFile" type="file" accept="audio/*"
onchange="showFileName(this,'audioName')">
<div id="audioName" class="small"></div>

<label>🎙 Ovoz yozish</label>
<div class="row">
<button onclick="startRecording()">🎙 Boshlash</button>
<button class="danger" onclick="stopRecording()">⏹ To‘xtatish</button>
</div>

<div id="recordStatus" class="small"></div>

<div id="uploadProgress" class="hidden">
<div class="small" id="uploadText">Yuklanmoqda...</div>
<div class="progress"><div id="progressBar"></div></div>
</div>

<div class="row">
<button class="green" onclick="saveStory()">💾 Saqlash</button>
<button class="secondary" onclick="cancelEdit()">Bekor qilish</button>
</div>

<div id="editorStatus"></div>
</div>

<div class="card">
<h2>📚 Hikoyalar</h2>
<div id="storiesList"></div>
</div>

</div>
</div>

<div id="passwordModal" class="modal hidden">
<div class="modal-box">
<button class="close" onclick="closeStoryPassword()">✕</button>
<h2>🔒 Parolli hikoya</h2>
<input id="readerPassword" type="password" placeholder="Parol">
<button onclick="verifyReaderPassword()">Ochish</button>
<div id="readerPasswordStatus"></div>
</div>
</div>

<div id="readerModal" class="modal hidden">
<div class="modal-box">
<button class="close" onclick="closeReader()">✕</button>
<div id="readerContent"></div>
</div>
</div>

<div id="mediaModal" class="modal hidden">
<div class="modal-box">
<button class="close" onclick="closeMedia()">✕</button>
<div id="mediaContent"></div>
</div>
</div>

<div id="quotesModal" class="modal hidden">
<div class="modal-box">
<button class="close" onclick="closeQuotes()">✕</button>
<h2>💬 Iqtiboslar</h2>
<div id="quotesList"></div>
</div>
</div>

<div id="recoveryModal" class="modal hidden">
<div class="modal-box">
<button class="close" onclick="closeRecovery()">✕</button>
<h2>🔑 Yangi parol</h2>
<input id="newPassword" type="password" placeholder="Yangi parol">
<button onclick="changePassword()">Saqlash</button>
<div id="recoveryStatus"></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://xponjbwjrbnonkuyhtzz.supabase.co";
const SUPABASE_KEY="sb_publishable_DSnyIy3Xp3w_Yn1CwaheXA_Gl6-bFon";
const ADMIN_ID="d83107c5-ac1a-49bf-a53d-7fe17f39f15b";

const supabaseClient=
window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let stories=[];
let editingId=null;
let uploadedVoice=null;
let mediaRecorder=null;
let recordedChunks=[];
let pendingStory=null;
let pendingMediaType=null;

const quotes=[
{id:"quote-1",text:"Ba’zi odamlar ketmaydi, shunchaki hayotingda o‘rnini yo‘qotadi."},
{id:"quote-2",text:"Ba’zan sukut — aytilgan mingta gapdan ham balandroq javobdir."},
{id:"quote-3",text:"Inson ba’zan yo‘qotgan narsasini emas, o‘sha narsa bilan o‘zini yo‘qotganini sog‘inadi."}
];

function status(id,msg,ok=false){
 const e=document.getElementById(id);
 if(!e)return;
 e.className="status "+(ok?"ok":"error");
 e.innerHTML=msg;
}

function escapeHtml(v){
 return String(v??"")
 .replaceAll("&","&amp;").replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function formatDate(v){
 return v?new Date(v).toLocaleString("uz-UZ"):"";
}

function randomToken(){return crypto.randomUUID()}

function getSiteUrl(){
 return window.location.origin+window.location.pathname;
}

function getMediaUrl(path){
 if(!path)return"";
 return supabaseClient.storage
 .from("story-media").getPublicUrl(path).data.publicUrl;
}<script>
async function register(){
 const email=authEmail.value.trim();
 const password=authPassword.value;

 if(!email||!password){
  status("authStatus","Email va parolni kiriting.");
  return;
 }

 const {error}=await supabaseClient.auth.signUp({email,password});

 if(error)status("authStatus",escapeHtml(error.message));
 else status("authStatus","Emailingizni tasdiqlash uchun pochtangizni tekshiring.",true);
}

async function login(){
 const email=authEmail.value.trim();
 const password=authPassword.value;

 const {data,error}=await supabaseClient.auth.signInWithPassword({
  email,password
 });

 if(error){
  status("authStatus",escapeHtml(error.message));
  return;
 }

 currentUser=data.user;
 updateAuthUI();
 await loadStories();
}

async function logout(){
 await supabaseClient.auth.signOut();
 currentUser=null;
 stories=[];
 updateAuthUI();
}

async function forgotPassword(){
 const email=authEmail.value.trim();

 if(!email){
  status("authStatus","Avval emailni kiriting.");
  return;
 }

 const {error}=await supabaseClient.auth.resetPasswordForEmail(
  email,{redirectTo:getSiteUrl()}
 );

 if(error)status("authStatus",escapeHtml(error.message));
 else status("authStatus","Parol tiklash havolasi emailingizga yuborildi.",true);
}

async function changePassword(){
 const password=newPassword.value;

 if(!password){
  status("recoveryStatus","Yangi parolni kiriting.");
  return;
 }

 const {error}=await supabaseClient.auth.updateUser({password});

 if(error)status("recoveryStatus",escapeHtml(error.message));
 else{
  status("recoveryStatus","Parol o‘zgartirildi.",true);
  setTimeout(closeRecovery,1000);
 }
}

function closeRecovery(){
 recoveryModal.classList.add("hidden");
}

function updateAuthUI(){
 if(currentUser){
  authSection.classList.add("hidden");
  userSection.classList.remove("hidden");
  mainSection.classList.remove("hidden");
  userInfo.innerHTML="👤 "+escapeHtml(currentUser.email);
 }else{
  authSection.classList.remove("hidden");
  userSection.classList.add("hidden");
  mainSection.classList.add("hidden");
 }
}

function newStory(){
 editingId=null;
 uploadedVoice=null;

 editorTitle.textContent="✍️ Yangi hikoya";
 storyTitle.value="";
 storyContent.value="";
 storyPublic.checked=false;
 storyPassword.value="";

 imageFile.value="";
 videoFile.value="";
 audioFile.value="";

 imageName.textContent="";
 videoName.textContent="";
 audioName.textContent="";
 recordStatus.textContent="";
 editorStatus.innerHTML="";

 editor.classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
 editingId=null;
 editor.classList.add("hidden");
}

function showFileName(input,id){
 const file=input.files[0];
 document.getElementById(id).textContent=
 file?"Tanlandi: "+file.name:"";
}

async function startRecording(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});

  recordedChunks=[];
  mediaRecorder=new MediaRecorder(stream);

  mediaRecorder.ondataavailable=e=>{
   if(e.data.size)recordedChunks.push(e.data);
  };

  mediaRecorder.onstop=()=>{
   const blob=new Blob(recordedChunks,{type:"audio/webm"});
   uploadedVoice=new File([blob],"voice.webm",{type:"audio/webm"});
   stream.getTracks().forEach(t=>t.stop());
   recordStatus.textContent="🎙 Ovoz yozildi.";
  };

  mediaRecorder.start();
  recordStatus.textContent="🔴 Yozilmoqda...";
 }catch(e){
  recordStatus.textContent="Mikrofonga ruxsat berilmadi.";
 }
}

function stopRecording(){
 if(mediaRecorder&&mediaRecorder.state!=="inactive")
  mediaRecorder.stop();
}

async function uploadMedia(file,label){
 if(!file)return null;

 const ext=file.name.includes(".")
 ?file.name.split(".").pop().toLowerCase()
 :"bin";

 const path=
 currentUser.id+"/"+crypto.randomUUID()+"."+ext;

 document.getElementById("uploadProgress").classList.remove("hidden");
 document.getElementById("uploadText").textContent=
 "Yuklanmoqda: "+file.name;

 document.getElementById("progressBar").style.width="25%";

 const {error}=await supabaseClient.storage
 .from("story-media")
 .upload(path,file,{
  upsert:false,
  contentType:file.type
 });

 document.getElementById("progressBar").style.width="100%";

 if(error)throw error;

 return path;
}

async function saveStory(){

 if(!currentUser){
  status("editorStatus","Avval tizimga kiring.");
  return;
 }

 const title=storyTitle.value.trim();
 const content=storyContent.value.trim();
 const isPublic=storyPublic.checked;
 const password=storyPassword.value;

 if(!title||!content){
  status("editorStatus","Sarlavha va matnni kiriting.");
  return;
 }

 const saveButton=document.querySelector(
  '#editor button[onclick="saveStory()"]'
 );

 if(saveButton)saveButton.disabled=true;

 try{

  uploadProgress.classList.remove("hidden");
  uploadText.textContent="Fayllar tayyorlanmoqda...";
  progressBar.style.width="5%";

  let image_path=null;
  let video_path=null;
  let audio_path=null;
  let voice_path=null;

  if(imageFile.files[0]){
   image_path=await uploadMedia(imageFile.files[0],"Rasm");
  }

  if(videoFile.files[0]){
   uploadText.textContent="🎬 Video yuklanmoqda...";
   video_path=await uploadMedia(videoFile.files[0],"Video");
  }

  if(audioFile.files[0]){
   audio_path=await uploadMedia(audioFile.files[0],"Audio");
  }

  if(uploadedVoice){
   voice_path=await uploadMedia(uploadedVoice,"Ovoz");
  }

  let hash=null;

  if(password){
   const result=await supabaseClient.rpc(
    "hash_story_password",
    {p_password:password}
   );

   if(result.error)throw result.error;
   hash=result.data;
  }

  const data={
   title,
   content,
   is_public:isPublic
  };

  if(image_path)data.image_path=image_path;
  if(video_path)data.video_path=video_path;
  if(audio_path)data.audio_path=audio_path;
  if(voice_path)data.voice_path=voice_path;

  if(password)data.story_password_hash=hash;

  if(editingId){

   const {error}=await supabaseClient
   .from("stories")
   .update(data)
   .eq("id",editingId);

   if(error)throw error;

  }else{

   data.owner_id=currentUser.id;
   data.share_token=randomToken();

   const {error}=await supabaseClient
   .from("stories")
   .insert(data);

   if(error)throw error;
  }

  status("editorStatus","✅ Muvaffaqiyatli saqlandi.",true);

  editingId=null;
  uploadedVoice=null;

  await loadStories();

  setTimeout(()=>{
   editor.classList.add("hidden");
   uploadProgress.classList.add("hidden");
   progressBar.style.width="0";
  },700);

 }catch(error){

  console.error(error);

  status(
   "editorStatus",
   "❌ Saqlashda xatolik: "+escapeHtml(error.message)
  );

 }finally{
  if(saveButton)saveButton.disabled=false;
 }
}

async function loadStories(){

 if(!currentUser)return;

 let query=supabaseClient
 .from("stories")
 .select("*")
 .order("created_at",{ascending:false});

 if(currentUser.id!==ADMIN_ID)
  query=query.eq("owner_id",currentUser.id);

 const {data,error}=await query;

 if(error){
  console.error(error);
  status("authStatus",escapeHtml(error.message));
  return;
 }

 stories=data||[];
 renderStories();
}

function renderStories(){

 const search=searchInput.value.toLowerCase().trim();

 const list=stories.filter(s=>
 !search||
 String(s.title||"").toLowerCase().includes(search)||
 String(s.content||"").toLowerCase().includes(search)
 );

 if(!list.length){
  storiesList.innerHTML="<p>Hozircha hikoya topilmadi.</p>";
  return;
 }

 storiesList.innerHTML=list.map(storyCard).join("");
}

function storyCard(s){

 return `
 <div class="story">
  <h3>${escapeHtml(s.title)}</h3>

  <div class="small">
   📅 ${formatDate(s.created_at)}
   · ${s.is_public?"🌍 Ochiq":"🔒 Yopiq"}
   ${s.story_password_hash?" · 🔐 Parolli":""}
  </div>

  <p>${escapeHtml(s.content).slice(0,300)}
  ${String(s.content).length>300?"...":""}</p>

  <div class="row">

   <button onclick="readStory('${s.id}')">📖 O‘qish</button>

   <button onclick="editStory('${s.id}')">✏️ Tahrirlash</button>

   <button class="danger"
   onclick="deleteStory('${s.id}')">🗑 O‘chirish</button>

   ${s.is_public?`
   <button onclick="copyStoryLink('${s.share_token}')">
   🔗 Hikoya linki
   </button>`:""}

  </div>

  <div class="row">

   ${s.is_public&&s.image_path?`
   <button onclick="copyMediaLink('${s.share_token}','image')">
   🔗 Rasm
   </button>`:""}

   ${s.is_public&&s.video_path?`
   <button onclick="copyMediaLink('${s.share_token}','video')">
   🔗 Video
   </button>`:""}

   ${s.is_public&&s.audio_path?`
   <button onclick="copyMediaLink('${s.share_token}','audio')">
   🔗 Audio
   </button>`:""}

   ${s.is_public&&s.voice_path?`
   <button onclick="copyMediaLink('${s.share_token}','voice')">
   🔗 Ovoz
   </button>`:""}

  </div>
 </div>
 `;
}

function editStory(id){

 const s=stories.find(x=>x.id===id);
 if(!s)return;

 editingId=id;
 uploadedVoice=null;

 editorTitle.textContent="✏️ Hikoyani tahrirlash";
 storyTitle.value=s.title||"";
 storyContent.value=s.content||"";
 storyPublic.checked=!!s.is_public;
 storyPassword.value="";

 editor.classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
  }<script>
async function deleteStory(id){

 const s=stories.find(x=>x.id===id);
 if(!s)return;

 if(!confirm("Bu hikoyani o‘chirasizmi?"))return;

 try{

  const paths=[
   s.image_path,
   s.video_path,
   s.audio_path,
   s.voice_path
  ].filter(Boolean);

  if(paths.length){
   await supabaseClient.storage
   .from("story-media")
   .remove(paths);
  }

  const {error}=await supabaseClient
  .from("stories")
  .delete()
  .eq("id",id);

  if(error)throw error;

  await loadStories();

 }catch(e){
  alert("Xatolik: "+e.message);
 }
}

async function copyStoryLink(token){

 const url=getSiteUrl()+"?story="+encodeURIComponent(token);

 try{
  await navigator.clipboard.writeText(url);
  alert("🔗 Hikoya linki nusxalandi!");
 }catch{
  prompt("Linkni nusxalang:",url);
 }
}

function getMediaShareLink(token,type){

 return getSiteUrl()+
 "?media="+encodeURIComponent(token)+
 "&type="+encodeURIComponent(type);
}

async function copyMediaLink(token,type){

 const url=getMediaShareLink(token,type);

 try{
  await navigator.clipboard.writeText(url);
  alert("🔗 Media linki nusxalandi!");
 }catch{
  prompt("Linkni nusxalang:",url);
 }
}

function readStory(id){

 const s=stories.find(x=>x.id===id);
 if(!s)return;

 if(s.story_password_hash){

  pendingStory=s;
  readerPassword.value="";
  readerPasswordStatus.innerHTML="";
  passwordModal.classList.remove("hidden");

 }else{
  openReader(s);
 }
}

function openReader(s){

 readerContent.innerHTML=`
 <h1>${escapeHtml(s.title)}</h1>

 <div class="small">
 📅 ${formatDate(s.created_at)}
 </div>

 <p style="white-space:pre-wrap;line-height:1.7">
 ${escapeHtml(s.content)}
 </p>

 ${renderReaderMedia(s)}

 ${s.is_public?`
 <div class="row">
 <button onclick="copyStoryLink('${s.share_token}')">
 🔗 Hikoya linkini nusxalash
 </button>
 </div>`:""}
 `;

 readerModal.classList.remove("hidden");
}

function renderReaderMedia(s){

 let h="";

 if(s.image_path){
  h+=`
  <img class="media"
  src="${getMediaUrl(s.image_path)}">
  `;
 }

 if(s.video_path){
  h+=`
  <video class="media" controls playsinline
  src="${getMediaUrl(s.video_path)}"></video>
  `;
 }

 if(s.audio_path){
  h+=`
  <audio class="media" controls
  src="${getMediaUrl(s.audio_path)}"></audio>
  `;
 }

 if(s.voice_path){
  h+=`
  <p>🎙 Ovoz yozuvi</p>
  <audio class="media" controls
  src="${getMediaUrl(s.voice_path)}"></audio>
  `;
 }

 return h;
}

function closeReader(){
 readerModal.classList.add("hidden");
}

function closeStoryPassword(){
 passwordModal.classList.add("hidden");
 pendingStory=null;
}

async function verifyReaderPassword(){

 if(!pendingStory)return;

 const password=readerPassword.value;

 const {data,error}=await supabaseClient.rpc(
  "verify_story_password",
  {
   p_token:pendingStory.share_token,
   p_password:password
  }
 );

 if(error){
  status("readerPasswordStatus",escapeHtml(error.message));
  return;
 }

 if(!data||!data.length){
  status("readerPasswordStatus","❌ Parol noto‘g‘ri.");
  return;
 }

 const s={...pendingStory,...data[0]};

 closeStoryPassword();
 openReader(s);
}

function quoteLink(id){

 return getSiteUrl()+
 "?quote="+encodeURIComponent(id);
}

async function copyQuoteLink(id){

 const url=quoteLink(id);

 try{
  await navigator.clipboard.writeText(url);
  alert("🔗 Iqtibos linki nusxalandi!");
 }catch{
  prompt("Linkni nusxalang:",url);
 }
}

function shareQuoteTelegram(id){

 const q=quotes.find(x=>x.id===id);
 if(!q)return;

 const url=quoteLink(id);

 const tg=
 "https://t.me/share/url?url="+
 encodeURIComponent(url)+
 "&text="+
 encodeURIComponent("“"+q.text+"”");

 window.open(tg,"_blank");
}

async function shareQuote(id){

 const q=quotes.find(x=>x.id===id);
 if(!q)return;

 const url=quoteLink(id);

 if(navigator.share){

  try{
   await navigator.share({
    title:"Munisam hikoyalari",
    text:q.text,
    url
   });
  }catch{}
 }else{
  copyQuoteLink(id);
 }
}

function showQuotes(){

 quotesList.innerHTML=quotes.map(q=>`

 <div class="quote">

  <div class="quote-text">
  “${escapeHtml(q.text)}”
  </div>

  <div class="row">

   <button onclick="copyQuoteLink('${q.id}')">
   🔗 Linkni nusxalash
   </button>

   <button class="telegram"
   onclick="shareQuoteTelegram('${q.id}')">
   📤 Telegram
   </button>

   <button class="light"
   onclick="shareQuote('${q.id}')">
   ↗️ Ulashish
   </button>

  </div>

 </div>

 `).join("");

 quotesModal.classList.remove("hidden");
}

function closeQuotes(){
 quotesModal.classList.add("hidden");
}

async function openPublicStory(token){

 const {data,error}=await supabaseClient.rpc(
  "get_public_story",
  {p_token:token}
 );

 if(error){
  showPublicError(error.message);
  return;
 }

 if(!data||!data.length){
  showPublicError("Hikoya topilmadi yoki ochiq emas.");
  return;
 }

 const s=data[0];

 if(s.is_password_protected){

  pendingStory=s;
  passwordModal.classList.remove("hidden");

  return;
 }

 showOnlyStory(s);
}

function showOnlyStory(s){

 document.body.innerHTML=`
 <div class="container">
  <div class="card">

   <h1>${escapeHtml(s.title)}</h1>

   <div class="small">
   📅 ${formatDate(s.created_at)}
   </div>

   <p style="white-space:pre-wrap;line-height:1.8">
   ${escapeHtml(s.content||"")}
   </p>

   ${renderReaderMedia(s)}

  </div>
 </div>
 `;
}

async function openPublicMedia(token,type){

 const {data,error}=await supabaseClient.rpc(
  "get_public_story",
  {p_token:token}
 );

 if(error){
  showPublicError(error.message);
  return;
 }

 if(!data||!data.length){
  showPublicError("Media topilmadi.");
  return;
 }

 const s=data[0];

 if(s.is_password_protected){
  showPublicError("Bu media parolli hikoyaga tegishli.");
  return;
 }

 showOnlyMedia(s,type);
}

function showOnlyMedia(s,type){

 let path=null;
 let title="";

 if(type==="image"){
  path=s.image_path;
  title="🖼 Rasm";
 }

 if(type==="video"){
  path=s.video_path;
  title="🎬 Video";
 }

 if(type==="audio"){
  path=s.audio_path;
  title="🎵 Audio";
 }

 if(type==="voice"){
  path=s.voice_path;
  title="🎙 Ovoz";
 }

 if(!path){
  showPublicError("Bu media mavjud emas.");
  return;
 }

 const url=getMediaUrl(path);

 let media="";

 if(type==="image")
  media=`<img class="media" src="${url}">`;

 if(type==="video")
  media=`<video class="media" controls autoplay playsinline src="${url}"></video>`;

 if(type==="audio"||type==="voice")
  media=`<audio class="media" controls autoplay src="${url}"></audio>`;

 document.body.innerHTML=`
 <div class="container">
  <div class="card">

   <h1>${escapeHtml(s.title)}</h1>

   <div class="small">
   ${title} · 📅 ${formatDate(s.created_at)}
   </div>

   ${media}

  </div>
 </div>
 `;
}

function showPublicError(msg){

 document.body.innerHTML=`
 <div class="container">
  <div class="card">
   <h2>❌ ${escapeHtml(msg)}</h2>
  </div>
 </div>
 `;
}

 mediaModal.classList.add("hidden");

 currentUser=data.session?.user||null;

}

);

async function handleInitialUrl(){

 const params=new URLSearchParams(
  window.location.search
 );

 const story=params.get("story");
 const media=params.get("media");
 const type=params.get("type");
 const quote=params.get("quote");

 if(quote){
  showQuoteOnly(quote);
  return;
 }

 if(media&&type){
  await openPublicMedia(media,type);
  return;
 }

 if(story){
  await openPublicStory(story);
  return;
 }
}

document.addEventListener("keydown",e=>{

 if(e.key==="Escape"){

  passwordModal.classList.add("hidden");
  readerModal.classList.add("hidden");
  mediaModal.classList.add("hidden");
  quotesModal.classList.add("hidden");
  recoveryModal.classList.add("hidden");

 }

});

document.addEventListener("DOMContentLoaded",async()=>{

 await checkUser();

 const hash=window.location.hash;

 if(hash.includes("type=recovery")){
  recoveryModal.classList.remove("hidden");
 }

 await handleInitialUrl();

});
</script>
