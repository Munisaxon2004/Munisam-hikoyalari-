<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Munisam hikoyalari</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 45px 20px;
      background: #000;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #aaa;
      margin-top: 10px;
    }

    .stories {
      max-width: 700px;
      margin: auto;
      padding: 25px 20px;
    }

    .story {
      background: #1d1d1d;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .story h2 {
      margin-top: 0;
    }

    .story p {
      color: #aaa;
      line-height: 1.6;
    }

    .read {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 20px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Munisam hikoyalari</h1>
    <p>Bu yerda mening hikoyalarim yashaydi.</p>
  </header>

  <main class="stories">

    <div class="story">
      <h2>Birinchi hikoyam</h2>
      <p>Bu hikoya tez orada shu yerda paydo bo‘ladi.</p>
      <a class="read" href="#">O‘qish</a>
    </div>

    <div class="story">
      <h2>Yangi hikoya</h2>
      <p>Bu yerga keyingi hikoyalarim joylanadi.</p>
      <a class="read" href="#">O‘qish</a>
    </div>

  </main>

  <footer>
    © Munisam hikoyalari
  </footer>

</body>
</html>
