<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munisam hikoyalari</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  text-align:center;
  padding:42px 20px;
  background:#000;
}

header h1{
  margin:0;
  font-size:32px;
}

header p{
  color:#999;
  margin-bottom:0;
}

.container{
  max-width:750px;
  margin:auto;
  padding:22px 16px;
}

.top{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.add{
  background:#fff;
  color:#000;
}

.search{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  background:#222;
  color:#fff;
}

.story{
  background:#1b1b1b;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
}

.story h2{
  margin-top:0;
}

.story p{
  color:#ccc;
  line-height:1.7;
  white-space:pre-wrap;
}

.actions{
  margin-top:15px;
}

.read{
  background:#fff;
  color:#000;
}

.edit{
  background:#333;
  color:#fff;
}

.delete{
  background:#401919;
  color:#fff;
}

.writer{
  display:none;
  background:#191919;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

.writer input,
.writer textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:0;
  border-radius:10px;
  background:#292929;
  color:#fff;
  font-size:15px;
}

.writer textarea{
  min-height:180px;
  resize:vertical;
}

.save{
  background:#fff;
  color:#000;
}

.cancel{
  background:#333;
  color:#fff;
}

.reader{
  display:none;
  background:#181818;
  padding:22px;
  border-radius:16px;
  margin-bottom:20px;
}

.reader h2{
  margin-top:0;
}

.reader-text{
  color:#ddd;
  line-height:1.9;
  white-space:pre-wrap;
}

.back{
  background:#333;
  color:#fff;
}

.quote{
  background:#171717;
  border-left:3px solid #fff;
  padding:18px;
  margin-top:25px;
  border-radius:10px;
  color:#ddd;
  line-height:1.8;
}

footer{
  text-align:center;
  padding:35px;
  color:#555;
}
</style>
</head>

<body>

<header>
  <h1>Munisam hikoyalari</h1>
  <p>Bu yerda mening hikoyalarim yashaydi.</p>
</header>

<main class="container">

  <div class="top">
    <input
      class="search"
      id="search"
      placeholder="Hikoya qidirish..."
      oninput="showStories()"
    >
    <button class="add" onclick="openWriter()">＋ Yangi hikoya</button>
  </div>

  <div class="writer" id="writer">

    <h2 id="formTitle">Yangi hikoya</h2>

    <input id="storyTitle" placeholder="Hikoya nomi">

    <textarea
      id="storyText"
      placeholder="Hikoyangizni shu yerga yozing..."
    ></textarea>

    <button class="save" onclick="saveStory()">Saqlash</button>
    <button class="cancel" onclick="closeWriter()">Bekor qilish</button>

  </div>

  <div class="reader" id="reader">

    <h2 id="readerTitle"></h2>

    <div class="reader-text" id="readerText"></div>

    <br>

    <button class="back" onclick="closeReader()">← Orqaga</button>

  </div>

  <div id="stories"></div>

  <div class="quote">
    <b>❤️ Iqtibos</b>
    <br><br>
    Taqdir bo‘lsa yana yo‘llar tutashadi, ko‘zlar to‘qnashadi. ❤️
    <br>
    Iltimos, shu taqdir yozilmagan bo‘lsin. 🤝🙂
  </div>

</main>

<footer>
  © Munisam hikoyalari
</footer>

<script>

let stories = JSON.parse(localStorage.getItem("munisamStories")) || [

  {
    id: 1,
    title: "Birinchi hikoyam",
    text: "Taqdir bo‘lsa yana yo‘llar tutashadi, ko‘zlar to‘qnashadi. ❤️\nIltimos, shu taqdir yozilmagan bo‘lsin. 🤝🙂"
  },

  {
    id: 2,
    title: "Yangi hikoya",
    text: "Tez orada..."
  }

];

let editingId = null;


function saveToStorage(){

  localStorage.setItem(
    "munisamStories",
    JSON.stringify(stories)
  );

}


function showStories(){

  let box = document.getElementById("stories");
  let search = document.getElementById("search").value.toLowerCase();

  box.innerHTML = "";

  let filtered = stories.filter(story =>
    story.title.toLowerCase().includes(search) ||
    story.text.toLowerCase().includes(search)
  );

  filtered.forEach(story => {

    let div = document.createElement("div");

    div.className = "story";

    div.innerHTML = `
      <h2>${escapeHTML(story.title)}</h2>

      <p>
        ${escapeHTML(story.text.substring(0,160))}
        ${story.text.length > 160 ? "..." : ""}
      </p>

      <div class="actions">

        <button class="read"
          onclick="openReader(${story.id})">
          O‘qish
        </button>

        <button class="edit"
          onclick="editStory(${story.id})">
          Tahrirlash
        </button>

        <button class="delete"
          onclick="deleteStory(${story.id})">
          O‘chirish
        </button>

      </div>
    `;

    box.appendChild(div);

  });

}


function openWriter(){

  editingId = null;

  document.getElementById("formTitle").innerText =
    "Yangi hikoya";

  document.getElementById("storyTitle").value = "";
  document.getElementById("storyText").value = "";

  document.getElementById("writer").style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function closeWriter(){

  document.getElementById("writer").style.display = "none";

}


function saveStory(){

  let title =
    document.getElementById("storyTitle").value.trim();

  let text =
    document.getElementById("storyText").value.trim();

  if(!title || !text){

    alert("Hikoya nomi va matnini yozing!");

    return;
  }


  if(editingId !== null){

    let story = stories.find(
      s => s.id === editingId
    );

    story.title = title;
    story.text = text;

  }else{

    stories.unshift({

      id: Date.now(),

      title: title,

      text: text

    });

  }


  saveToStorage();

  closeWriter();

  showStories();

}


function editStory(id){

  let story = stories.find(
    s => s.id === id
  );

  if(!story) return;

  editingId = id;

  document.getElementById("formTitle").innerText =
    "Hikoyani tahrirlash";

  document.getElementById("storyTitle").value =
    story.title;

  document.getElementById("storyText").value =
    story.text;

  document.getElementById("writer").style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function deleteStory(id){

  if(!confirm("Bu hikoyani o‘chirmoqchimisiz?")){

    return;
  }

  stories = stories.filter(
    story => story.id !== id
  );

  saveToStorage();

  showStories();

}


function openReader(id){

  let story = stories.find(
    s => s.id === id
  );

  if(!story) return;

  document.getElementById("readerTitle").innerText =
    story.title;

  document.getElementById("readerText").innerText =
    story.text;

  document.getElementById("reader").style.display =
    "block";

  document.getElementById("stories").style.display =
    "none";

  document.querySelector(".quote").style.display =
    "none";

}


function closeReader(){

  document.getElementById("reader").style.display =
    "none";

  document.getElementById("stories").style.display =
    "block";

  document.querySelector(".quote").style.display =
    "block";

}


function escapeHTML(text){

  let div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


showStories();

</script>

</body>
</html>
