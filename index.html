<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Munisam hikoyalari</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    linear-gradient(#0008,#0008),
    url("IMG_20260708_133902_971.jpg") center/cover fixed no-repeat;
}
.container{max-width:1000px;margin:auto;padding:20px}
header{
  text-align:center;
  padding:25px 10px;
}
h1{margin:0 0 8px;font-size:32px}
h2{margin-top:0}
.card{
  background:#111c;
  backdrop-filter:blur(10px);
  border:1px solid #ffffff25;
  border-radius:18px;
  padding:18px;
  margin:15px 0;
}
input,textarea,button,select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ffffff35;
  background:#ffffff12;
  color:#fff;
  font-size:15px;
}
textarea{min-height:180px;resize:vertical}
button{
  cursor:pointer;
  background:#ffffff20;
}
button:hover{background:#ffffff35}
.btnrow{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.btnrow button{width:auto;flex:1;min-width:130px}
.hidden{display:none!important}
.story-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:8px;
}
.date{opacity:.7;font-size:13px}
.story-content{
  white-space:pre-wrap;
  line-height:1.6;
  margin-top:12px;
}
.quote{
  padding:15px;
  margin:10px 0;
  border-left:4px solid #fff;
  background:#ffffff10;
  border-radius:8px;
}
.quote-text{
  font-size:18px;
  line-height:1.5;
}
.media{
  width:100%;
  max-height:500px;
  margin-top:10px;
  border-radius:12px;
}
.status{
  padding:10px;
  border-radius:10px;
  background:#ffffff12;
  margin:8px 0;
}
.progress{
  height:8px;
  background:#ffffff20;
  border-radius:10px;
  overflow:hidden;
}
.progress div{
  height:100%;
  width:0;
  background:#fff;
  transition:.2s;
}
.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99;
}
.modal-box{
  width:min(500px,100%);
  background:#181818;
  border-radius:18px;
  padding:20px;
}
.small{font-size:13px;opacity:.7}
a{color:#fff}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>🌊 Munisam hikoyalari</h1>
  <div>Hikoyalar • Iqtiboslar • Xotiralar</div>
</header>

<section id="authSection" class="card">
  <h2>Kirish</h2>

  <input id="authEmail" type="email" placeholder="Email">
  <input id="authPassword" type="password" placeholder="Parol">

  <div class="btnrow">
    <button onclick="login()">Kirish</button>
    <button onclick="registerUser()">Ro‘yxatdan o‘tish</button>
  </div>

  <button onclick="forgotPassword()">Parolni unutdingizmi?</button>
  <div id="authStatus" class="status hidden"></div>
</section>

<section id="userSection" class="card hidden">
  <div id="userInfo"></div>

  <div class="btnrow">
    <button onclick="newStory()">＋ Yangi hikoya</button>
    <button onclick="logout()">Chiqish</button>
  </div>
</section>

<section id="mainSection" class="hidden">

  <div class="card">
    <input id="searchInput"
           placeholder="🔎 Hikoya qidirish..."
           oninput="renderStories()">
  </div>

  <div id="editor" class="card hidden">
    <h2 id="editorTitle">Yangi hikoya</h2>

    <input id="storyTitle" placeholder="Hikoya nomi">

    <textarea id="storyContent"
      placeholder="Hikoyangizni yozing..."></textarea>

    <label>
      <input id="storyPublic" type="checkbox" style="width:auto">
      Ommaviy hikoya
    </label>

    <input id="storyPassword"
           type="password"
           placeholder="Parol (ixtiyoriy)">

    <hr>

    <label>🖼️ Rasm</label>
    <input id="imageFile" type="file" accept="image/*"
           onchange="showFileName('imageFile','imageName')">
    <div id="imageName" class="small"></div>

    <label>🎬 Video</label>
    <input id="videoFile" type="file" accept="video/*"
           onchange="showFileName('videoFile','videoName')">
    <div id="videoName" class="small"></div>

    <label>🎵 Audio</label>
    <input id="audioFile" type="file" accept="audio/*"
           onchange="showFileName('audioFile','audioName')">
    <div id="audioName" class="small"></div>

    <label>🎤 Ovoz yozish</label>
    <div class="btnrow">
      <button onclick="startRecording()">🎙️ Boshlash</button>
      <button onclick="stopRecording()">⏹️ To‘xtatish</button>
    </div>

    <div id="recordStatus" class="small"></div>

    <div class="progress">
      <div id="uploadProgress"></div>
    </div>
    <div id="uploadStatus" class="status hidden"></div>

    <div class="btnrow">
      <button onclick="saveStory()">💾 Saqlash</button>
      <button onclick="cancelEdit()">Bekor qilish</button>
    </div>
  </div>

  <div id="storiesSection" class="card">
    <h2>📚 Hikoyalar</h2>
    <div id="storiesList"></div>
  </div>

  <div class="card">
    <h2>💬 Iqtiboslar</h2>
    <div id="quotesList"></div>
  </div>

</section>
</div>

<div id="passwordModal" class="modal hidden">
  <div class="modal-box">
    <h2>🔐 Himoyalangan hikoya</h2>
    <input id="readerPassword"
           type="password"
           placeholder="Hikoya paroli">
    <div id="readerPasswordStatus" class="status hidden"></div>

    <div class="btnrow">
      <button onclick="verifyReaderPassword()">Ochish</button>
      <button onclick="closeModal('passwordModal')">Yopish</button>
    </div>
  </div>
</div>

<div id="recoveryModal" class="modal hidden">
  <div class="modal-box">
    <h2>🔑 Yangi parol</h2>
    <input id="newPassword"
           type="password"
           placeholder="Yangi parol">
    <button onclick="changePassword()">Parolni o‘zgartirish</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://xponjbwjrbnonkuyhtzz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DSnyIy3Xp3w_Yn1CwaheXA_Gl6-bFon";

const ADMIN_ID =
"d83107c5-ac1a-49bf-a53d-7fe17f39f15b";

const BUCKET = "story-media";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let stories = [];
let editingStory = null;
let pendingStory = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;

const quotes = [
 {
  id:"quote-1",
  text:"Ba'zi odamlar ketmaydi, shunchaki hayotingda o‘rnini yo‘qotadi."
 },
 {
  id:"quote-2",
  text:"Ba'zan sukut — aytilmagan mingta gapdan ham balandroq."
 },
 {
  id:"quote-3",
  text:"Ketganlar emas, qolib seni tushunmaganlar ko‘proq og‘ritadi."
 }
];

function $(id){
  return document.getElementById(id);
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showStatus(id,text){
  const el=$(id);
  if(!el)return;
  el.textContent=text;
  el.classList.remove("hidden");
}

function hide(id){
  $(id)?.classList.add("hidden");
}

function closeModal(id){
  $(id)?.classList.add("hidden");
}

function makeToken(){
  return crypto.randomUUID().replaceAll("-","");
}

function publicMediaUrl(path){
  if(!path)return "";
  return supabaseClient
    .storage
    .from(BUCKET)
    .getPublicUrl(path).data.publicUrl;
}

function getStoryLink(token){
  return location.origin+
    location.pathname+
    "?story="+encodeURIComponent(token);
}

function getQuoteLink(id){
  return location.origin+
    location.pathname+
    "?quote="+encodeURIComponent(id);
}

function getMediaLink(token,type){
  return location.origin+
    location.pathname+
    "?media="+encodeURIComponent(token)+
    "&type="+encodeURIComponent(type);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    alert("Link nusxalandi ✅");
  }catch(e){
    const area=document.createElement("textarea");
    area.value=text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
    alert("Link nusxalandi ✅");
  }
}<script>
async function registerUser(){
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;

  if(!email||!password){
    showStatus("authStatus","Email va parolni kiriting.");
    return;
  }

  const {error}=await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){
    showStatus("authStatus",error.message);
    return;
  }

  showStatus(
    "authStatus",
    "Ro‘yxatdan o‘tildi. Email tasdiqlash kerak bo‘lishi mumkin."
  );
}

async function login(){
  const email=$("authEmail").value.trim();
  const password=$("authPassword").value;

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showStatus("authStatus",error.message);
    return;
  }

  currentUser=data.user;
  await updateAuthUI();
  await loadStories();
}

async function logout(){
  await supabaseClient.auth.signOut();
  currentUser=null;
  location.href=location.pathname;
}

async function forgotPassword(){
  const email=$("authEmail").value.trim();

  if(!email){
    showStatus("authStatus","Avval emailingizni yozing.");
    return;
  }

  const {error}=await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:location.origin+
        location.pathname+
        "?recovery=1"
    }
  );

  if(error){
    showStatus("authStatus",error.message);
    return;
  }

  showStatus(
    "authStatus",
    "Parolni tiklash havolasi emailingizga yuborildi."
  );
}

async function changePassword(){
  const password=$("newPassword").value;

  if(!password){
    alert("Yangi parolni kiriting.");
    return;
  }

  const {error}=await supabaseClient.auth.updateUser({
    password
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Parol o‘zgartirildi ✅");
  closeModal("recoveryModal");
}

async function updateAuthUI(){
  if(!currentUser){
    $("authSection").classList.remove("hidden");
    $("userSection").classList.add("hidden");
    $("mainSection").classList.add("hidden");
    return;
  }

  $("authSection").classList.add("hidden");
  $("userSection").classList.remove("hidden");
  $("mainSection").classList.remove("hidden");

  const admin =
    currentUser.id===ADMIN_ID;

  $("userInfo").innerHTML=
    "👤 "+escapeHtml(currentUser.email)+
    (admin?"<br>👑 Admin":"");
}

function newStory(){
  editingStory=null;

  $("editorTitle").textContent="Yangi hikoya";
  $("storyTitle").value="";
  $("storyContent").value="";
  $("storyPublic").checked=false;
  $("storyPassword").value="";

  $("imageFile").value="";
  $("videoFile").value="";
  $("audioFile").value="";

  $("imageName").textContent="";
  $("videoName").textContent="";
  $("audioName").textContent="";
  $("recordStatus").textContent="";

  recordedBlob=null;
  recordedChunks=[];

  $("editor").classList.remove("hidden");
  window.scrollTo({
    top:$("editor").offsetTop,
    behavior:"smooth"
  });
}

function cancelEdit(){
  $("editor").classList.add("hidden");
  editingStory=null;
}

function editStory(story){
  editingStory=story;

  $("editorTitle").textContent="Hikoyani tahrirlash";
  $("storyTitle").value=story.title||"";
  $("storyContent").value=story.content||"";
  $("storyPublic").checked=!!story.is_public;
  $("storyPassword").value="";

  $("imageFile").value="";
  $("videoFile").value="";
  $("audioFile").value="";

  $("editor").classList.remove("hidden");

  window.scrollTo({
    top:$("editor").offsetTop,
    behavior:"smooth"
  });
}

function showFileName(inputId,labelId){
  const file=$(inputId).files[0];
  $(labelId).textContent=
    file?file.name:"";
}

async function startRecording(){
  try{
    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    recordedChunks=[];
    recordedBlob=null;

    mediaRecorder=
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable=e=>{
      if(e.data.size>0)
        recordedChunks.push(e.data);
    };

    mediaRecorder.onstop=()=>{
      recordedBlob=
        new Blob(recordedChunks,{
          type:"audio/webm"
        });

      stream.getTracks().forEach(t=>t.stop());

      $("recordStatus").textContent=
        "🎤 Ovoz yozib olindi.";
    };

    mediaRecorder.start();

    $("recordStatus").textContent=
      "🔴 Ovoz yozilmoqda...";
  }catch(e){
    $("recordStatus").textContent=
      "Mikrofonga ruxsat berilmadi.";
  }
}

function stopRecording(){
  if(mediaRecorder &&
     mediaRecorder.state!=="inactive"){
    mediaRecorder.stop();
  }
}

function setProgress(value){
  $("uploadProgress").style.width=
    Math.max(0,Math.min(100,value))+"%";
}

async function uploadMedia(file,userId,folder){
  if(!file)return null;

  const safeName=
    file.name
      .replace(/[^\w.\-]/g,"_")
      .slice(-80);

  const path=
    userId+"/"+folder+"/"+Date.now()+"_"+safeName;

  showStatus(
    "uploadStatus",
    "Yuklanmoqda: "+safeName
  );

  setProgress(20);

  const {error}=await supabaseClient
    .storage
    .from(BUCKET)
    .upload(path,file,{
      upsert:false
    });

  if(error)throw error;

  setProgress(100);

  return path;
}

async function saveStory(){
  if(!currentUser){
    alert("Avval tizimga kiring.");
    return;
  }

  const title=$("storyTitle").value.trim();
  const content=$("storyContent").value.trim();
  const isPublic=$("storyPublic").checked;
  const password=$("storyPassword").value;

  if(!title){
    alert("Hikoya nomini yozing.");
    return;
  }

  setProgress(0);
  $("uploadStatus").classList.remove("hidden");
  $("uploadStatus").textContent="Saqlanmoqda...";

  try{
    let shareToken=
      editingStory?.share_token||makeToken();

    let imagePath=
      editingStory?.image_path||null;

    let videoPath=
      editingStory?.video_path||null;

    let audioPath=
      editingStory?.audio_path||null;

    let voicePath=
      editingStory?.voice_path||null;

    const image=$("imageFile").files[0];
    const video=$("videoFile").files[0];
    const audio=$("audioFile").files[0];

    if(image){
      imagePath=
        await uploadMedia(
          image,currentUser.id,"images"
        );
    }

    if(video){
      videoPath=
        await uploadMedia(
          video,currentUser.id,"videos"
        );
    }

    if(audio){
      audioPath=
        await uploadMedia(
          audio,currentUser.id,"audio"
        );
    }

    if(recordedBlob){
      voicePath=
        await uploadMedia(
          new File(
            [recordedBlob],
            "voice.webm",
            {type:"audio/webm"}
          ),
          currentUser.id,
          "voice"
        );
    }

    let passwordHash=
      editingStory?.story_password_hash||null;

    if(password){
      const {data,error}=await supabaseClient
        .rpc("hash_story_password",{
          p_password:password
        });

      if(error)throw error;

      passwordHash=data;
    }

    const row={
      title,
      content,
      owner_id:currentUser.id,
      is_public:isPublic,
      share_token:shareToken,
      story_password_hash:passwordHash,
      image_path:imagePath,
      video_path:videoPath,
      audio_path:audioPath,
      voice_path:voicePath
    };

    let result;

    if(editingStory){
      result=
        await supabaseClient
          .from("stories")
          .update(row)
          .eq("id",editingStory.id);
    }else{
      result=
        await supabaseClient
          .from("stories")
          .insert(row);
    }

    if(result.error)throw result.error;

    alert("Hikoya saqlandi ✅");

    editingStory=null;
    $("editor").classList.add("hidden");

    setProgress(100);

    await loadStories();

  }catch(e){
    console.error(e);

    $("uploadStatus").textContent=
      "Xatolik: "+e.message;

    alert("Saqlashda xatolik:\n"+e.message);
  }
}

async function loadStories(){
  if(!currentUser)return;

  let query=
    supabaseClient
      .from("stories")
      .select("*")
      .order("created_at",{
        ascending:false
      });

  if(currentUser.id!==ADMIN_ID){
    query=query.eq(
      "owner_id",
      currentUser.id
    );
  }

  const {data,error}=await query;

  if(error){
    console.error(error);
    $("storiesList").innerHTML=
      "<div class='status'>"+
      escapeHtml(error.message)+
      "</div>";
    return;
  }

  stories=data||[];
  renderStories();
}

function renderStories(){
  const q=
    $("searchInput").value
      .trim()
      .toLowerCase();

  const filtered=
    stories.filter(s=>
      (s.title||"").toLowerCase().includes(q)||
      (s.content||"").toLowerCase().includes(q)
    );

  if(!filtered.length){
    $("storiesList").innerHTML=
      "<div class='small'>Hikoya topilmadi.</div>";
    return;
  }

  $("storiesList").innerHTML=
    filtered.map(storyCard).join("");
 }<script>
function storyCard(s){
  const storyLink=
    s.is_public?
      getStoryLink(s.share_token):
      "";

  let media="";

  if(s.image_path){
    const url=publicMediaUrl(s.image_path);
    media+=`
      <img class="media"
           src="${url}">
      ${
        s.is_public?
        `<button onclick="copyMediaLink('${escapeHtml(s.share_token)}','image')">
          🖼️ Rasm linkini nusxalash
        </button>`:""
      }
    `;
  }

  if(s.video_path){
    const url=publicMediaUrl(s.video_path);
    media+=`
      <video class="media"
             controls
             src="${url}"></video>
      ${
        s.is_public?
        `<button onclick="copyMediaLink('${escapeHtml(s.share_token)}','video')">
          🎬 Video linkini nusxalash
        </button>`:""
      }
    `;
  }

  if(s.audio_path){
    const url=publicMediaUrl(s.audio_path);
    media+=`
      <audio class="media"
             controls
             src="${url}"></audio>
      ${
        s.is_public?
        `<button onclick="copyMediaLink('${escapeHtml(s.share_token)}','audio')">
          🎵 Audio linkini nusxalash
        </button>`:""
      }
    `;
  }

  if(s.voice_path){
    const url=publicMediaUrl(s.voice_path);
    media+=`
      <audio class="media"
             controls
             src="${url}"></audio>
      ${
        s.is_public?
        `<button onclick="copyMediaLink('${escapeHtml(s.share_token)}','voice')">
          🎤 Ovoz linkini nusxalash
        </button>`:""
      }
    `;
  }

  return `
    <div class="card">

      <div class="story-title">
        ${escapeHtml(s.title)}
      </div>

      <div class="date">
        ${new Date(s.created_at).toLocaleString("uz-UZ")}
      </div>

      <div class="story-content">
        ${escapeHtml(s.content)}
      </div>

      ${media}

      <div class="btnrow">

        <button onclick="readStory('${s.id}')">
          📖 O‘qish
        </button>

        <button onclick="editStoryById('${s.id}')">
          ✏️ Tahrirlash
        </button>

        <button onclick="deleteStory('${s.id}')">
          🗑️ O‘chirish
        </button>

        ${
          s.is_public?
          `<button onclick="copyStoryLink('${escapeHtml(s.share_token)}')">
            🔗 Hikoya linki
          </button>`:""
        }

      </div>

      ${
        s.is_public?
        `<div class="small">
          🔓 Ommaviy
          ${
            s.story_password_hash?
            " • 🔐 Parol bilan himoyalangan":""
          }
        </div>`:
        `<div class="small">🔒 Yopiq</div>`
      }

    </div>
  `;
}

function editStoryById(id){
  const story=
    stories.find(s=>s.id===id);

  if(story)editStory(story);
}

async function deleteStory(id){
  const story=
    stories.find(s=>s.id===id);

  if(!story)return;

  if(!confirm(
    "Bu hikoyani o‘chirmoqchimisiz?"
  ))return;

  const paths=[
    story.image_path,
    story.video_path,
    story.audio_path,
    story.voice_path
  ].filter(Boolean);

  if(paths.length){
    await supabaseClient
      .storage
      .from(BUCKET)
      .remove(paths);
  }

  const {error}=
    await supabaseClient
      .from("stories")
      .delete()
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  await loadStories();
}

function copyStoryLink(token){
  copyText(getStoryLink(token));
}

function copyMediaLink(token,type){
  copyText(getMediaLink(token,type));
}

function readStory(id){
  const story=
    stories.find(s=>s.id===id);

  if(!story)return;

  renderReader(story);
}

function renderReader(s){
  document.body.innerHTML=`
    <div class="container">
      <div class="card">
        <button onclick="location.reload()">
          ← Orqaga
        </button>

        <h1>${escapeHtml(s.title)}</h1>

        <div class="date">
          ${new Date(s.created_at).toLocaleString("uz-UZ")}
        </div>

        <div class="story-content">
          ${escapeHtml(s.content)}
        </div>

        ${
          s.image_path?
          `<img class="media"
                src="${publicMediaUrl(s.image_path)}">`:""
        }

        ${
          s.video_path?
          `<video class="media"
                  controls
                  src="${publicMediaUrl(s.video_path)}">
          </video>`:""
        }

        ${
          s.audio_path?
          `<audio class="media"
                  controls
                  src="${publicMediaUrl(s.audio_path)}">
          </audio>`:""
        }

        ${
          s.voice_path?
          `<audio class="media"
                  controls
                  src="${publicMediaUrl(s.voice_path)}">
          </audio>`:""
        }
      </div>
    </div>
  `;
}

async function openPublicStory(token){
  const {data,error}=
    await supabaseClient
      .rpc("get_public_story",{
        p_token:token
      });

  if(error||!data?.length){
    showPublicError(
      "Hikoya topilmadi yoki o‘chirilgan."
    );
    return;
  }

  const story=data[0];

  if(story.is_password_protected){
    pendingStory=story;
    $("passwordModal").classList.remove("hidden");
    return;
  }

  showOnlyStory(story);
}

async function verifyReaderPassword(){
  if(!pendingStory)return;

  const password=
    $("readerPassword").value;

  const {data,error}=
    await supabaseClient
      .rpc("verify_story_password",{
        p_token:pendingStory.share_token,
        p_password:password
      });

  if(error||!data?.length){
    showStatus(
      "readerPasswordStatus",
      "Parol noto‘g‘ri."
    );
    return;
  }

  closeModal("passwordModal");

  showOnlyStory({
    ...pendingStory,
    ...data[0]
  });

  pendingStory=null;
}

function showOnlyStory(s){
  document.body.innerHTML=`
    <div class="container">
      <div class="card">

        <h1>${escapeHtml(s.title)}</h1>

        <div class="date">
          ${new Date(s.created_at).toLocaleString("uz-UZ")}
        </div>

        <div class="story-content">
          ${escapeHtml(s.content||"")}
        </div>

        ${
          s.image_path?
          `<img class="media"
                src="${publicMediaUrl(s.image_path)}">`:""
        }

        ${
          s.video_path?
          `<video class="media"
                  controls
                  src="${publicMediaUrl(s.video_path)}">
          </video>`:""
        }

        ${
          s.audio_path?
          `<audio class="media"
                  controls
                  src="${publicMediaUrl(s.audio_path)}">
          </audio>`:""
        }

        ${
          s.voice_path?
          `<audio class="media"
                  controls
                  src="${publicMediaUrl(s.voice_path)}">
          </audio>`:""
        }

      </div>
    </div>
  `;
}

async function openPublicMedia(token,type){
  const {data,error}=
    await supabaseClient
      .rpc("get_public_story",{
        p_token:token
      });

  if(error||!data?.length){
    showPublicError("Media topilmadi.");
    return;
  }

  const story=data[0];

  if(story.is_password_protected){
    showPublicError(
      "Bu media parol bilan himoyalangan. Avval hikoya linkini oching."
    );
    return;
  }

  showOnlyMedia(story,type);
}

function showOnlyMedia(story,type){
  let path=null;
  let title="";

  if(type==="image"){
    path=story.image_path;
    title="🖼️ Rasm";
  }

  if(type==="video"){
    path=story.video_path;
    title="🎬 Video";
  }

  if(type==="audio"){
    path=story.audio_path;
    title="🎵 Audio";
  }

  if(type==="voice"){
    path=story.voice_path;
    title="🎤 Ovoz";
  }

  if(!path){
    showPublicError("Media mavjud emas.");
    return;
  }

  const url=publicMediaUrl(path);

  let media="";

  if(type==="image"){
    media=
      `<img class="media" src="${url}">`;
  }

  if(type==="video"){
    media=
      `<video class="media"
              controls
              autoplay
              src="${url}">
       </video>`;
  }

  if(type==="audio"||type==="voice"){
    media=
      `<audio class="media"
              controls
              autoplay
              src="${url}">
       </audio>`;
  }

  document.body.innerHTML=`
    <div class="container">
      <div class="card">

        <h1>${escapeHtml(title)}</h1>

        <div class="date">
          ${new Date(story.created_at)
            .toLocaleString("uz-UZ")}
        </div>

        ${media}

        <div class="small">
          ${escapeHtml(story.title)}
        </div>

      </div>
    </div>
  `;
 }<script>
function showQuotes(){
  $("quotesList").innerHTML=
    quotes.map(q=>`
      <div class="quote">

        <div class="quote-text">
          “${escapeHtml(q.text)}”
        </div>

        <div class="btnrow">

          <button onclick="copyQuoteLink('${q.id}')">
            🔗 Linkni nusxalash
          </button>

          <button onclick="shareQuoteTelegram('${q.id}')">
            📲 Telegram
          </button>

        </div>

      </div>
    `).join("");
}

function copyQuoteLink(id){
  copyText(getQuoteLink(id));
}

function shareQuoteTelegram(id){
  const quote=
    quotes.find(q=>q.id===id);

  if(!quote)return;

  const url=getQuoteLink(id);

  const telegram=
    "https://t.me/share/url?url="+
    encodeURIComponent(url)+
    "&text="+
    encodeURIComponent(
      "“"+quote.text+"”"
    );

  window.open(
    telegram,
    "_blank"
  );
}

function showQuoteOnly(id){
  const quote=
    quotes.find(q=>q.id===id);

  if(!quote){
    showPublicError(
      "Iqtibos topilmadi."
    );
    return;
  }

  const url=getQuoteLink(id);

  document.body.innerHTML=`
    <div class="container">
      <div class="card">

        <h1>💬 Iqtibos</h1>

        <div class="quote">
          <div class="quote-text">
            “${escapeHtml(quote.text)}”
          </div>
        </div>

        <button onclick="copyText('${url}')">
          🔗 Iqtibos linkini nusxalash
        </button>

        <button onclick="shareQuoteTelegram('${id}')">
          📲 Telegramga yuborish
        </button>

      </div>
    </div>
  `;
}

function showPublicError(text){
  document.body.innerHTML=`
    <div class="container">
      <div class="card">
        <h2>😔 ${escapeHtml(text)}</h2>
      </div>
    </div>
  `;
}

async function checkUser(){
  const {data}=await supabaseClient.auth.getSession();

  currentUser=data.session?.user||null;

  await updateAuthUI();

  if(currentUser){
    await loadStories();
  }
}

function handleInitialUrl(){
  const params=
    new URLSearchParams(
      location.search
    );

  const story=
    params.get("story");

  const quote=
    params.get("quote");

  const media=
    params.get("media");

  const type=
    params.get("type");

  const recovery=
    params.get("recovery");

  if(recovery==="1"){
    $("recoveryModal")
      .classList.remove("hidden");
    return;
  }

  if(quote){
    showQuoteOnly(quote);
    return;
  }

  if(story){
    openPublicStory(story);
    return;
  }

  if(media&&type){
    openPublicMedia(media,type);
    return;
  }
}

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{
    currentUser=
      session?.user||null;

    if(event==="PASSWORD_RECOVERY"){
      $("recoveryModal")
        .classList.remove("hidden");
    }

    await updateAuthUI();

    if(currentUser){
      await loadStories();
    }
  }
);

document.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Escape"){
      closeModal("passwordModal");
      closeModal("recoveryModal");
    }
  }
);

document.addEventListener(
  "DOMContentLoaded",
  async()=>{
    showQuotes();
    await checkUser();
    handleInitialUrl();
  }
);
</script>
