function toast(text){
 const el=document.getElementById("toast");
 if(!el)return;

 el.textContent=text;
 el.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
  el.style.display="none";
 },2500);
}

function esc(value=""){
 return String(value).replace(
  /[&<>"']/g,
  ch=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[ch])
 );
}

function uid(){
 return crypto.randomUUID();
}

function makeSlug(text){

 let s=String(text||"").toLowerCase();

 const map={
  "а":"a","б":"b","в":"v","г":"g","д":"d",
  "е":"e","ё":"yo","ж":"j","з":"z","и":"i",
  "й":"y","к":"k","л":"l","м":"m","н":"n",
  "о":"o","п":"p","р":"r","с":"s","т":"t",
  "у":"u","ф":"f","х":"x","ц":"c","ч":"ch",
  "ш":"sh","щ":"sh","ъ":"","ы":"y","ь":"",
  "э":"e","ю":"yu","я":"ya"
 };

 s=s.replace(
  /[а-яёъыь]/g,
  ch=>map[ch]??ch
 );

 s=s
  .replace(/o‘|oʻ|o’|o'/g,"o")
  .replace(/g‘|gʻ|g’|g'/g,"g")
  .replace(/[^a-z0-9]+/g,"-")
  .replace(/^-+|-+$/g,"");

 if(!s)s="hikoya";

 return s+"-"+uid().slice(0,8);
}

function dateText(value){
 return new Date(value).toLocaleString("uz-UZ");
}

function publicMedia(path){

 if(!path)return "";

 return sb.storage
  .from(BUCKET)
  .getPublicUrl(path)
  .data.publicUrl;
}

function storyLink(token){
 return location.origin+
 location.pathname+
 "?story="+
 encodeURIComponent(token);
}

function quoteLink(index){
 return location.origin+
 location.pathname+
 "?quote="+
 encodeURIComponent(index);
}

async function copyText(text){

 try{
  await navigator.clipboard.writeText(text);
  toast("Link nusxalandi");
 }catch{

  const area=document.createElement("textarea");

  area.value=text;
  document.body.appendChild(area);
  area.select();
  document.execCommand("copy");
  area.remove();

  toast("Link nusxalandi");
 }
}

function telegram(text){

 location.href=
 "https://t.me/share/url?url="+
 encodeURIComponent(text);
}

function toggleMenu(id){

 const menu=document.getElementById(id);
 if(!menu)return;

 document
  .querySelectorAll(".more-menu.show")
  .forEach(el=>{
   if(el!==menu)
    el.classList.remove("show");
  });

 menu.classList.toggle("show");
}

document.addEventListener("click",event=>{

 if(!event.target.closest(".more")){

  document
   .querySelectorAll(".more-menu.show")
   .forEach(el=>{
    el.classList.remove("show");
   });

 }
});

async function getCurrentUser(){

 const {data}=await sb.auth.getUser();

 currentUser=data.user||null;

 return currentUser;
}

function isAdmin(){
 return !!(
  currentUser &&
  currentUser.id===ADMIN_ID
 );
}

function resetFiles(){

 selectedImage=null;
 selectedVideo=null;
 selectedAudio=null;

}

function renderAuth(){

 app.innerHTML=`

 <div class="auth">

  <h1 class="center">
   Munisam hikoyalari
  </h1>

  <p class="center">
   Hisobingizga kiring
  </p>

  <input
   id="email"
   type="email"
   placeholder="Email">

  <input
   id="password"
   type="password"
   placeholder="Parol">

  <div class="row">

   <button onclick="login()">
    Kirish

   <button

    onclick="register()">
    Ro‘yxatdan o‘tish

async function login(){

 const email=
  document.getElementById("email")
   .value.trim();

 const password=
  document.getElementById("password")
   .value;

 if(!email||!password)
  return toast("Email va parolni kiriting");

 const {error}=
  await sb.auth.signInWithPassword({
   email,
   password
  });

 if(error)
  return toast(error.message);

 await init();
}

async function register(){

 const email=
  document.getElementById("email")
   .value.trim();

 const password=
  document.getElementById("password")
   .value;

 if(!email)
  return toast("Emailni kiriting");

 if(password.length<6)
  return toast(
   "Parol kamida 6 belgidan iborat bo‘lsin"
  );

 const {error}=
  await sb.auth.signUp({
   email,
   password
  });

 if(error)
  return toast(error.message);

 toast("Ro‘yxatdan o‘tish muvaffaqiyatli");
}

async function forgot(){

 const email=
  document.getElementById("email")
   .value.trim();

 if(!email)
  return toast("Emailni kiriting");

 const {error}=
  await sb.auth.resetPasswordForEmail(
   email,
   {
    redirectTo:
     location.origin+
     location.pathname
   }
  );

 if(error)
  return toast(error.message);

 toast("Parolni tiklash havolasi yuborildi");
}

async function logout(){

 await sb.auth.signOut();

 currentUser=null;

 renderAuth();
}

async function init(){

 await getCurrentUser();

 if(!currentUser){
  renderAuth();
  return;
 }

 renderHome();
}

}async function startVoice(){

 try{

  const stream=
   await navigator.mediaDevices.getUserMedia({
    audio:true
   });

  voiceChunks=[];

  recorder=new MediaRecorder(stream);

  recorder.ondataavailable=e=>{
   if(e.data.size)
    voiceChunks.push(e.data);
  };

  recorder.onstop=()=>{

   selectedVoice=new File(
    voiceChunks,
    "voice-"+Date.now()+".webm",
    {type:"audio/webm"}
   );

   stream.getTracks().forEach(
    track=>track.stop()
   );

   const el=
    document.getElementById("voiceStatus");

   if(el)
    el.textContent="Ovoz yozib olindi ✓";
  };

  recorder.start();

  const el=
   document.getElementById("voiceStatus");

  if(el)
   el.textContent="Ovoz yozilmoqda...";

 }catch(e){

  toast("Mikrofonga ruxsat berilmadi");
 }
}

function stopVoice(){

 if(
  recorder &&
  recorder.state!=="inactive"
 ){
  recorder.stop();
 }
}

async function uploadFile(file,folder){

 if(!file)return null;

 const ext=
  file.name.includes(".")
   ? file.name.split(".").pop()
   : "bin";

 const path=
  folder+"/"+uid()+"."+ext;

 const {error}=
  await sb.storage
   .from(BUCKET)
   .upload(
    path,
    file,
    {
     upsert:false,
     contentType:file.type
    }
   );

 if(error)
  throw error;

 return path;
}

async function hashPassword(password){

 if(!password)return null;

 const {data,error}=
  await sb.rpc(
   "hash_story_password",
   {
    p_password:password
   }
  );

 if(error)
  throw error;

 return data;
}

async function saveStory(){

 if(!currentUser)
  return toast("Avval tizimga kiring");

 const title=
  document.getElementById("title")
   .value.trim();

 const content=
  document.getElementById("content")
   .value.trim();

 const isPublic=
  document.getElementById("public")
   .value==="true";

 const password=
  document.getElementById("storyPassword")
   .value;

 if(!title)
  return toast("Hikoya nomini yozing");

 if(!content)
  return toast("Hikoya matnini yozing");

 try{

  const progressBox=
   document.getElementById("progressBox");

  const progressBar=
   document.getElementById("progressBar");

  const progressText=
   document.getElementById("progressText");

  progressBox.classList.remove("hidden");

  progressBar.value=5;
  progressText.textContent="5%";

  let imagePath=null;
  let videoPath=null;
  let audioPath=null;
  let voicePath=null;

  if(selectedImage){

   imagePath=
    await uploadFile(
     selectedImage,
     "images"
    );

   progressBar.value=25;
   progressText.textContent="25%";
  }

  if(selectedVideo){

   videoPath=
    await uploadFile(
     selectedVideo,
     "videos"
    );

   progressBar.value=45;
   progressText.textContent="45%";
  }

  if(selectedAudio){

   audioPath=
    await uploadFile(
     selectedAudio,
     "audio"
    );

   progressBar.value=60;
   progressText.textContent="60%";
  }

  if(selectedVoice){

   voicePath=
    await uploadFile(
     selectedVoice,
     "voices"
    );

   progressBar.value=70;
   progressText.textContent="70%";
  }

  let passwordHash=null;

  if(password)
   passwordHash=
    await hashPassword(password);

  const payload={
   title,
   slug:makeSlug(title),
   content,
   user_id:currentUser.id,
   is_public:isPublic,
   password_hash:passwordHash,
   image_path:imagePath,
   video_path:videoPath,
   audio_path:audioPath,
   voice_path:voicePath
  };

  if(editingId){

   const {error}=
    await sb
     .from("stories")
     .update(payload)
     .eq("id",editingId);

   if(error)
    throw error;

   toast("Hikoya yangilandi");

  }else{

   const {error}=
    await sb
     .from("stories")
     .insert(payload);

   if(error)
    throw error;

   toast("Hikoya saqlandi");
  }

  progressBar.value=100;
  progressText.textContent="100%";

  resetFiles();

  setTimeout(
   ()=>renderHome(),
   500
  );

 }catch(e){

  console.error(e);

  toast(
   e.message||
   "Saqlashda xatolik"
  );
 }
}

async function loadStories(){

 const box=
  document.getElementById("stories");

 if(!box)return;

 box.innerHTML=
  "<div class='box'>Yuklanmoqda...</div>";

 let query=
  sb
   .from("stories")
   .select("*")
   .order(
    "created_at",
    {ascending:false}
   );

 if(!isAdmin()){

  query=
   query.eq(
    "user_id",
    currentUser.id
   );
 }

 const {data,error}=
  await query;

 if(error){

  box.innerHTML=
   `<div class="box">
     ${esc(error.message)}
    </div>`;

  return;
 }

 const search=
  (
   document.getElementById("search")?.value||
   ""
  ).toLowerCase().trim();

 const stories=
  (data||[]).filter(s=>
   !search||
   String(s.title||"")
    .toLowerCase()
    .includes(search)||
   String(s.content||"")
    .toLowerCase()
    .includes(search)
  );

 if(!stories.length){

  box.innerHTML=
   `<div class="box">
     Hozircha hikoyalar yo‘q.
    </div>`;

  return;
 }

 box.innerHTML=
  stories.map(storyCard).join("");
}

function storyCard(s){

 const menuId=
  "story-menu-"+String(s.id)
   .replace(/-/g,"");

 const sl=
  s.share_token
   ? storyLink(s.share_token)
   : "";

 let media="";

 if(s.image_path){

  const url=
   publicMedia(s.image_path);

  media+=`
   <div class="media">
    <img
     src="${esc(url)}"
     alt="${esc(s.title)}">
   </div>`;
 }

 if(s.video_path){

  const url=
   publicMedia(s.video_path);

  media+=`
   <div class="media">
    <video
     controls
     src="${esc(url)}">
    </video>
   </div>`;
 }

 if(s.audio_path){

  const url=
   publicMedia(s.audio_path);

  media+=`
   <div class="media">
    <audio
     controls
     src="${esc(url)}">
    </audio>
   </div>`;
 }

 if(s.voice_path){

  const url=
   publicMedia(s.voice_path);

  media+=`
   <div class="media">
    <p><b>🎙 Ovoz</b></p>
    <audio
     controls
     src="${esc(url)}">
    </audio>
   </div>`;
 }

 return `

 <div class="story">

  <div class="more">

   <button
    onclick="event.stopPropagation();
    toggleMenu('${menuId}')">
    ⋮
   </button>

   <div
    id="${menuId}"
    class="more-menu">

    ${
     sl
      ? `<button
          onclick='copyText(${JSON.stringify(sl)})'>
          🔗 Linkni nusxalash
         </button>`
      : ""
    }

    <button
     onclick="editStory('${s.id}')">
     ✏️ Tahrirlash
    </button>

    <button
     class="red-item"
     onclick="deleteStory('${s.id}')">
     🗑 O‘chirish
    </button>

   </div>

  </div>

  <h3>${esc(s.title)}</h3>

  <div class="date">
   ${dateText(s.created_at)}
  </div>

  <p>
   ${esc(s.content).replace(/\n/g,"<br>")}
  </p>

  ${media}

  <div class="small">
   ${
    s.is_public
     ? "🌐 Ochiq"
     : "🔒 Yopiq"
   }
  </div>

  <button
   style="margin-top:10px"
   onclick="readStory('${s.id}')">
   📖 O‘qish
  </button>

 </div>`;
}

   id="content"
   placeholder="Hikoya matni">${esc(s.content)}</textarea>

  <label><b>Yangi rasm</b></label>

  <input
   id="image"
   type="file"
   accept="image/*"
   onchange="selectedImage=this.files[0]">

  <label><b>Yangi video</b></label>

  <input
   id="video"
   type="file"
   accept="video/*"
   onchange="selectedVideo=this.files[0]">

  <label><b>Yangi audio</b></label>

  <input
   id="audio"
   type="file"
   accept="audio/*"
   onchange="selectedAudio=this.files[0]">

  <label><b>Ovoz</b></label>

  <div class="row">

   <button
    type="button"
    onclick="startVoice()">
    🎙 Boshlash
   </button>

   <button
    type="button"
    class="red"
    onclick="stopVoice()">
    To‘xtatish
   </button>

  </div>

  <p id="voiceStatus" class="small"></p>

  <label><b>Hikoya turi</b></label>

  <select
   id="public"
   style="width:100%;padding:12px;border-radius:10px">

   <option
    value="true"
    ${s.is_public ? "selected" : ""}>
    Ochiq
   </option>

   <option
    value="false"
    ${!s.is_public ? "selected" : ""}>
    Yopiq
   </option>

  </select>

  <input
   id="storyPassword"
   type="password"
   placeholder="Yangi parol (ixtiyoriy)">

  <p class="small">
   Eski fayllar o‘chmaydi.
   Yangi fayl tanlasangiz,
   yangi fayl biriktiriladi.
  </p>

  <div id="progressBox" class="hidden">

   <progress
    id="progressBar"
    value="0"
    max="100">
   </progress>

   <div id="progressText">0%</div>

  </div>

  <button
   class="green"
   style="width:100%;margin-top:12px"
   onclick="saveStory()">
   O‘zgarishlarni saqlash
  </button>

 </div>`;
}

async function deleteStory(id){

 if(!confirm("Bu hikoya o‘chirilsinmi?"))
  return;

 const {error}=
  await sb
   .from("stories")
   .delete()
   .eq("id",id);

 if(error)
  return toast(error.message);

 toast("Hikoya o‘chirildi");

 await loadStories();
 }function showQuotes(){

 app.innerHTML=`

 <div class="box">

  <button
   class="alt back"
   onclick="renderHome()">
   ← Orqaga
  </button>

  <h2>Iqtiboslar</h2>

  <div id="quotesList"></div>

 </div>`;

 const box=
  document.getElementById("quotesList");

 box.innerHTML=
  quotes.length
   ? quotes.map((q,i)=>{

      const l=quoteLink(i);
      const menuId="quote-menu-"+i;

      return `

      <div class="quote">

       <div class="more">

        <button
         onclick="event.stopPropagation();
         toggleMenu('${menuId}')">
         ⋮
        </button>

        <div
         id="${menuId}"
         class="more-menu">

         <button
          onclick='copyText(${JSON.stringify(l)})'>
          🔗 Linkni nusxalash
         </button>

         <button
          onclick='telegram(${JSON.stringify(l)})'>
          Telegramga yuborish
         </button>

         <button
          class="red-item"
          onclick="deleteQuote(${i})">
          🗑 O‘chirish
         </button>

        </div>

       </div>

       <p>${esc(q)}</p>

      </div>`;

     }).join("")
   : `<div class="small">
       Hozircha iqtiboslar yo‘q.
      </div>`;
}

function deleteQuote(i){

 if(!confirm("Bu iqtibos o‘chirilsinmi?"))
  return;

 quotes.splice(i,1);

 saveQuotes();
 showQuotes();

 toast("Iqtibos o‘chirildi");
}

function showQuoteOnly(i){

 const q=quotes[i];

 if(!q){

  app.innerHTML=`

   <div class="box center">

    <h2>Iqtibos topilmadi</h2>

   </div>`;

  return;
 }

 const link=quoteLink(i);

 app.innerHTML=`

 <div class="box">

  <h2>Munisam hikoyalari</h2>

  <div class="quote">

   <p>${esc(q)}</p>

  </div>

  <div class="row">

   <button
    onclick='copyText(${JSON.stringify(link)})'>
    🔗 Linkni nusxalash
   </button>

   <button
    class="alt"
    onclick='telegram(${JSON.stringify(link)})'>
    Telegram
   </button>

  </div>

 </div>`;
}

async function publicStory(token){

 const {data,error}=
  await sb.rpc(
   "get_public_story",
   {
    p_token:token
   }
  );

 if(error){

  app.innerHTML=`

   <div class="box center">

    <h2>Hikoya topilmadi</h2>

    <p>${esc(error.message)}</p>

   </div>`;

  return;
 }

 const s=
  Array.isArray(data)
   ? data[0]
   : data;

 if(!s){

  app.innerHTML=`

   <div class="box center">

    <h2>Hikoya topilmadi</h2>

   </div>`;

  return;
 }

 if(s.password_hash){

  app.innerHTML=`

   <div class="auth">

    <h2>🔒 Yopiq hikoya</h2>

    <p>
     Bu hikoyani o‘qish uchun parol kerak.
    </p>

    <input
     id="publicPassword"
     type="password"
     placeholder="Parol">

    <button
     style="width:100%"
     onclick="verifyPublic('${esc(token)}')">
     Ochish
    </button>

   </div>`;

  return;
 }

 showPublicStory(s);
}

async function verifyPublic(token){

 const password=
  document
   .getElementById("publicPassword")
   .value;

 if(!password)
  return toast("Parolni kiriting");

 const {data,error}=
  await sb.rpc(
   "verify_story_password",
   {
    p_token:token,
    p_password:password
   }
  );

 if(error)
  return toast(error.message);

 if(!data)
  return toast("Parol noto‘g‘ri");

 const result=
  await sb.rpc(
   "get_public_story",
   {
    p_token:token
   }
  );

 if(result.error)
  return toast(result.error.message);

 const s=
  Array.isArray(result.data)
   ? result.data[0]
   : result.data;

 showPublicStory(s);
}

function showPublicStory(s){

 let media="";

 if(s.image_path){

  const url=
   publicMedia(s.image_path);

  media+=`

   <div class="media">

    <img
     src="${esc(url)}"
     alt="${esc(s.title)}">

   </div>`;
 }

 if(s.video_path){

  const url=
   publicMedia(s.video_path);

  media+=`

   <div class="media">

    <video
     controls
     src="${esc(url)}">
    </video>

   </div>`;
 }

 if(s.audio_path){

  const url=
   publicMedia(s.audio_path);

  media+=`

   <div class="media">

    <audio
     controls
     src="${esc(url)}">
    </audio>

   </div>`;
 }

 if(s.voice_path){

  const url=
   publicMedia(s.voice_path);

  media+=`

   <div class="media">

    <p>🎙 Ovoz</p>

    <audio
     controls
     src="${esc(url)}">
    </audio>

   </div>`;
 }

 app.innerHTML=`

 <div class="box">

  <h1>${esc(s.title)}</h1>

  <div class="date">
   ${dateText(s.created_at)}
  </div>

  <hr>

  <div>
   ${esc(s.content).replace(/\n/g,"<br>")}
  </div>

  ${media}

 </div>`;
}

async function publicMediaPage(token,type){

 const {data,error}=
  await sb.rpc(
   "get_public_story",
   {
    p_token:token
   }
  );

 if(error)
  return toast(error.message);

 const s=
  Array.isArray(data)
   ? data[0]
   : data;

 if(!s)
  return toast("Topilmadi");

 let path=null;

 if(type==="image")
  path=s.image_path;

 if(type==="video")
  path=s.video_path;

 if(type==="audio")
  path=s.audio_path;

 if(type==="voice")
  path=s.voice_path;

 if(!path)
  return toast("Media topilmadi");

 const url=
  publicMedia(path);

 app.innerHTML=`

 <div class="box center">

  <h2>${esc(s.title)}</h2>

  <a
   href="${esc(url)}"
   target="_blank"
   rel="noopener">
   Media faylini ochish
  </a>

 </div>`;
}

async function handleUrl(){

 const params=
  new URLSearchParams(location.search);

 const story=params.get("story");
 const quote=params.get("quote");
 const media=params.get("media");
 const type=params.get("type");

 if(quote!==null){

  showQuoteOnly(
   Number(quote)
  );

  return true;
 }

 if(story){

  await publicStory(story);

  return true;
 }

 if(media){

  await publicMediaPage(
   media,
   type
  );

  return true;
 }

 return false;
}async function changePassword(){

 const password=
  document
   .getElementById("newPassword")
   .value;

 if(!password||password.length<6)
  return toast(
   "Parol kamida 6 belgidan iborat bo‘lsin"
  );

 const {error}=
  await sb.auth.updateUser({
   password:password
  });

 if(error)
  return toast(error.message);

 toast("Parol o‘zgartirildi");

 setTimeout(
  ()=>renderHome(),
  700
 );
}

function showPasswordChange(){

 app.innerHTML=`

 <div class="auth">

  <button
   class="alt back"
   onclick="renderHome()">
   ← Orqaga
  </button>

  <h2>Yangi parol</h2>

  <input
   id="newPassword"
   type="password"
   placeholder="Yangi parol">

  <button
   style="width:100%"
   onclick="changePassword()">
   Parolni saqlash
  </button>

 </div>`;
}

sb.auth.onAuthStateChange(
 async(event,session)=>{

  currentUser=
   session?.user||null;

  if(event==="PASSWORD_RECOVERY"){

   showPasswordChange();

   return;
  }

  if(!session){

   if(!location.search)
    renderAuth();

   return;
  }

  if(!location.search)
   renderHome();
 }
);

(async()=>{

 const handled=
  await handleUrl();

 if(!handled)
  await init();

})();
</script>
