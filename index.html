<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#222;
 background:linear-gradient(#0003,#0005),url("IMG_20260708_133902_971.jpg") center/cover fixed;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{max-width:900px;margin:auto;padding:18px}
header,.box,.story,.quote,.auth{
 background:#fffffff0;border-radius:18px;padding:18px;margin-bottom:16px;

}

nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{

}
button.alt{background:#777}
button.red{background:#b3261e}
button.green{background:#237a3b}
input,textarea{
 width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;margin:6px 0 10px;

textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}

.hidden{display:none!important}
.story{position:relative}

.date{font-size:12px;color:#666}
.media{margin-top:12px}
.media img,.media video,.media audio{

}
.quote{border-left:5px solid #333}
.small{font-size:13px;color:#555}
.linkbox{word-break:break-all;background:#eee;padding:9px;border-radius:8px}
#progressBox{margin-top:8px}
#progressBar{width:100%;height:12px}
#toast{
 position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
 background:#222;color:#fff;padding:12px 18px;border-radius:12px;
 display:none;z-index:9999
}
.auth{max-width:500px;margin:40px auto}
.center{text-align:center}
.back{margin-bottom:15px}
hr{border:0;border-top:1px solid #ddd;margin:18px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const SUPABASE_URL="https://xponjbwjrbnonkuyhtzz.supabase.co";
const SUPABASE_KEY="sb_publishable_DSnyIy3Xp3w_Yn1CwaheXA_Gl6-bFon";
const ADMIN_ID="d83107c5-ac1a-49bf-a53d-7fe17f39f15b";
const BUCKET="story-media";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById("app");

let currentUser=null;
let editingId=null;
let selectedImage=null;
let selectedVideo=null;
let selectedAudio=null;
let selectedVoice=null;
let recorder=null;
let voiceChunks=[];

const quotes=[
 "Ba'zi odamlar ketmaydi, shunchaki hayotingda o‘rnini yo‘qotadi.",
 "Ba'zan sukut — aytilmagan eng rost gapdir.",
 "Insonni yo‘qotishdan ko‘ra, uning yonida o‘zingni yo‘qotish og‘irroq.",
 "Vaqt hamma narsani tuzatmaydi, ba'zilariga shunchaki ko‘nikishni o‘rgatadi."
];

function toast(t){
 const x=document.getElementById("toast");
 x.textContent=t;x.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>x.style.display="none",2500);
}

function esc(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function uid(){return crypto.randomUUID()}

function dateText(d){
 return new Date(d).toLocaleString("uz-UZ");
}

function publicMedia(path){
 if(!path)return "";
 return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

function storyLink(token){
 return location.origin+location.pathname+"?story="+encodeURIComponent(token);
}

function mediaLink(token,type){
 return location.origin+location.pathname+"?media="+encodeURIComponent(token)+"&type="+encodeURIComponent(type);
}

function quoteLink(i){
 return location.origin+location.pathname+"?quote="+i;
}

async function copyText(t){
 try{
  await navigator.clipboard.writeText(t);
  toast("Link nusxalandi");
 }catch{
  const a=document.createElement("textarea");
  a.value=t;document.body.appendChild(a);a.select();
  document.execCommand("copy");a.remove();toast("Link nusxalandi");
 }
}

function telegram(t){
 location.href="https://t.me/share/url?url="+encodeURIComponent(t);
}

async function user(){
 const {data}=await sb.auth.getUser();
 currentUser=data.user||null;
 return currentUser;
}

function isAdmin(){
 return currentUser && currentUser.id===ADMIN_ID;
}

function resetFiles(){
 selectedImage=null;selectedVideo=null;selectedAudio=null;selectedVoice=null;
}

function renderAuth(){
 app.innerHTML=`
 <div class="auth">
 <h1 class="center">Munisam hikoyalari</h1>
 <p class="center">Kirish yoki yangi hisob yaratish</p>
 <input id="email" type="email" placeholder="Email">
 <input id="password" type="password" placeholder="Parol">
 <div class="row">
  <button onclick="login()">Kirish</button>
  <button class="alt" onclick="register()">Ro‘yxatdan o‘tish</button>
 </div>
 <button class="alt" style="width:100%;margin-top:8px" onclick="forgot()">Parolni tiklash</button>
 </div>`;
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password)return toast("Email va parolni kiriting");
 const {error}=await sb.auth.signInWithPassword({email,password});
 if(error)return toast(error.message);
 await init();
}

async function register(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||password.length<6)return toast("Email va kamida 6 belgili parol kerak");
 const {error}=await sb.auth.signUp({email,password});
 if(error)return toast(error.message);
 toast("Ro‘yxatdan o‘tish muvaffaqiyatli");
}

async function forgot(){
 const email=document.getElementById("email").value.trim();
 if(!email)return toast("Avval email yozing");
 const {error}=await sb.auth.resetPasswordForEmail(email,{
  redirectTo:location.origin+location.pathname
 });
 if(error)return toast(error.message);
 toast("Parolni tiklash havolasi emailga yuborildi");
}

async function logout(){
 await sb.auth.signOut();
 currentUser=null;
 renderAuth();
}

async function init(){
 await user();
 if(!currentUser){renderAuth();return}
 renderHome();
}

async function renderHome(){
 app.innerHTML=`
 <header>
  <h1>Munisam hikoyalari</h1>
  <p class="small">${esc(currentUser.email)}</p>
  <nav>
   <button onclick="renderHome()">Bosh sahifa</button>
   <button onclick="showAdd()">+ Hikoya</button>
   <button onclick="showQuotes()">Iqtiboslar</button>

  </nav>

}function showAdd(){
 editingId=null;
 resetFiles();
 app.innerHTML=`
 <div class="box">
 <button class="alt back" onclick="renderHome()">← Orqaga</button>
 <h2>Yangi hikoya</h2>
 <input id="title" placeholder="Hikoya nomi">
 <textarea id="content" placeholder="Hikoya matni"></textarea>

 <label><b>Rasm</b></label>
 <input id="image" type="file" accept="image/*" onchange="selectedImage=this.files[0]">

 <label><b>Video</b></label>
 <input id="video" type="file" accept="video/*" onchange="selectedVideo=this.files[0]">

 <label><b>Musiqa/audio</b></label>
 <input id="audio" type="file" accept="audio/*" onchange="selectedAudio=this.files[0]">

 <label><b>Ovoz yozish</b></label>
 <div class="row">
  <button type="button" onclick="startVoice()">🎙 Boshlash</button>
  <button type="button" class="red" onclick="stopVoice()">To‘xtatish</button>
 </div>
 <p id="voiceStatus" class="small"></p>

 <label><b>Hikoya turi</b></label>
 <select id="public" style="width:100%;padding:12px;border-radius:10px">
  <option value="true">Ochiq</option>
  <option value="false">Yopiq</option>
 </select>

 <input id="storyPassword" type="password" placeholder="Parol (ixtiyoriy)">

 <div id="progressBox" class="hidden">
  <progress id="progressBar" value="0" max="100"></progress>
  <div id="progressText">0%</div>
 </div>

 <button class="green" style="width:100%;margin-top:12px" onclick="saveStory()">Saqlash</button>
 </div>`;
}

async function startVoice(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  voiceChunks=[];
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};
  recorder.onstop=()=>{
   selectedVoice=new File(
    [new Blob(voiceChunks,{type:"audio/webm"})],
    "voice.webm",{type:"audio/webm"}
   );
   stream.getTracks().forEach(t=>t.stop());
   document.getElementById("voiceStatus").textContent="Ovoz yozib olindi.";
  };
  recorder.start();
  document.getElementById("voiceStatus").textContent="Yozilmoqda...";
 }catch(e){
  toast("Mikrofonga ruxsat berilmadi");
 }
}

function stopVoice(){
 if(recorder&&recorder.state!=="inactive")recorder.stop();
}

function progress(n){
 const box=document.getElementById("progressBox");
 const bar=document.getElementById("progressBar");
 const txt=document.getElementById("progressText");
 if(!box||!bar)return;
 box.classList.remove("hidden");
 bar.value=n;txt.textContent=n+"%";
}

async function uploadFile(file,folder){
 if(!file)return null;
 const ext=(file.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"");
 const path=currentUser.id+"/"+folder+"/"+uid()+"."+ext;
 progress(10);
 const {error}=await sb.storage.from(BUCKET).upload(path,file,{
  cacheControl:"3600",upsert:false
 });
 if(error)throw error;
 progress(100);
 return path;
}

async function hashPassword(p){
 if(!p)return null;
 const {data,error}=await sb.rpc("hash_story_password",{p_password:p});
 if(error)throw error;
 return data;
}

async function saveStory(){
 try{
  const title=document.getElementById("title").value.trim();
  const content=document.getElementById("content").value;
  const isPublic=document.getElementById("public").value==="true";
  const password=document.getElementById("storyPassword").value;

  if(!title)return toast("Hikoya nomini yozing");
  if(!content.trim()&&!selectedImage&&!selectedVideo&&!selectedAudio&&!selectedVoice)
   return toast("Hikoya yoki media qo‘shing");

  progress(5);

  let old=null;
  if(editingId){
   const {data}=await sb.from("stories").select("*").eq("id",editingId).single();
   old=data;
  }

  let image_path=old?.image_path||null;
  let video_path=old?.video_path||null;
  let audio_path=old?.audio_path||null;
  let voice_path=old?.voice_path||null;

  if(selectedImage)image_path=await uploadFile(selectedImage,"images");
  if(selectedVideo)video_path=await uploadFile(selectedVideo,"videos");
  if(selectedAudio)audio_path=await uploadFile(selectedAudio,"audio");
  if(selectedVoice)voice_path=await uploadFile(selectedVoice,"voice");

  let story_password_hash=old?.story_password_hash||null;
  if(password)story_password_hash=await hashPassword(password);

  if(editingId){
   const {error}=await sb.from("stories").update({
    title,content,is_public:isPublic,story_password_hash,
    image_path,video_path,audio_path,voice_path
   }).eq("id",editingId);
   if(error)throw error;
  }else{
   const {error}=await sb.from("stories").insert({
    title,content,owner_id:currentUser.id,is_public:isPublic,
    share_token:uid(),story_password_hash,
    image_path,video_path,audio_path,voice_path
   });
   if(error)throw error;
  }

  progress(100);
  toast("Hikoya saqlandi");
  setTimeout(renderHome,500);
 }catch(e){
  console.error(e);
  toast("Saqlashda xato: "+(e.message||e));
 }
}

async function loadStories(){
 const box=document.getElementById("stories");
 if(!box)return;

 const q=(document.getElementById("search")?.value||"").toLowerCase();

 let query=sb.from("stories").select("*").order("created_at",{ascending:false});

 if(!isAdmin())query=query.eq("owner_id",currentUser.id);

 const {data,error}=await query;
 if(error){
  box.innerHTML=`<div class="box">Xato: ${esc(error.message)}</div>`;
  return;
 }

 const arr=(data||[]).filter(s=>
  !q||s.title.toLowerCase().includes(q)||
  (s.content||"").toLowerCase().includes(q)
 );

 if(!arr.length){
  box.innerHTML="<div class='box'>Hozircha hikoyalar yo‘q.</div>";
  return;
 }

 box.innerHTML=arr.map(storyCard).join("");
}

 <button style="margin-top:15px" onclick="copyText('${esc(storyLink(data.share_token))}')">Hikoya linkini nusxalash</button>

 editingId=id;

 <h2>Hikoyani tahrirlash</h2>
 <input id="title" value="${esc(data.title)}">
 <textarea id="content">${esc(data.content||"")}</textarea>

 <p class="small">Yangi fayl tanlasangiz eski fayl o‘rniga yangi fayl ishlatiladi.</p>
 <input id="image" type="file" accept="image/*" onchange="selectedImage=this.files[0]">
 <input id="video" type="file" accept="video/*" onchange="selectedVideo=this.files[0]">
 <input id="audio" type="file" accept="audio/*" onchange="selectedAudio=this.files[0]">

 <select id="public" style="width:100%;padding:12px;border-radius:10px">

 <div id="progressBox" class="hidden">

  <div id="progressText">0%</div>

 <button class="green" style="width:100%" onclick="saveStory()">Saqlash</button>
 </div>`;
}

async function deleteStory(id){
 if(!confirm("Bu hikoya o‘chirilsinmi?"))return;

 const {data,error}=await sb.from("stories").select("*").eq("id",id).single();
 if(error)return toast(error.message);

 const paths=[data.image_path,data.video_path,data.audio_path,data.voice_path].filter(Boolean);

 const {error:delError}=await sb.from("stories").delete().eq("id",id);
 if(delError)return toast(delError.message);

 if(paths.length){
  const {error:e}=await sb.storage.from(BUCKET).remove(paths);
  if(e)console.warn(e);
 }

 toast("Hikoya o‘chirildi");
 loadStories();
}

async function publicStory(token){
 const {data,error}=await sb.rpc("get_public_story",{p_token:token});
 if(error||!data?.length){
  document.body.innerHTML="<div class='box' style='margin:30px'>Hikoya topilmadi.</div>";
  return;
 }
 const s=data[0];

 if(s.is_password_protected){
  document.body.innerHTML=`
   <div class="auth">
    <h2>${esc(s.title)}</h2>
    <p>Bu hikoya parol bilan himoyalangan.</p>
    <input id="publicPassword" type="password" placeholder="Parol">
    <button style="width:100%" onclick="verifyPublic('${esc(token)}')">Ochish</button>
   </div>`;
  return;
 }
 showPublicStory(s);
}

async function verifyPublic(token){
 const p=document.getElementById("publicPassword").value;
 if(!p)return toast("Parolni kiriting");

 const {data,error}=await sb.rpc("verify_story_password",{
  p_token:token,p_password:p
 });
 if(error||!data?.length)return toast("Parol noto‘g‘ri");

 showPublicStory(data[0]);
}

function showPublicStory(s){
 document.body.innerHTML=`
 <div id="app">
 <div class="box" style="max-width:850px;margin:25px auto">
  <h1>${esc(s.title)}</h1>
  <div class="date">${dateText(s.created_at)}</div>
  <hr>
  <div style="white-space:pre-wrap">${esc(s.content||"")}</div>
  ${s.image_path?`<div class="media"><img src="${esc(publicMedia(s.image_path))}"></div>`:""}
  ${s.video_path?`<div class="media"><video controls src="${esc(publicMedia(s.video_path))}"></video></div>`:""}
  ${s.audio_path?`<div class="media"><audio controls src="${esc(publicMedia(s.audio_path))}"></audio></div>`:""}
  ${s.voice_path?`<div class="media"><audio controls src="${esc(publicMedia(s.voice_path))}"></audio></div>`:""}
 </div>
 </div>`;
}async function publicMediaPage(token,type){
 const {data,error}=await sb.rpc("get_public_story",{p_token:token});

 if(error||!data?.length){
  document.body.innerHTML="<div class='box' style='margin:30px'>Media topilmadi.</div>";
  return;
 }

 const s=data[0];
 let path=null;

 if(type==="image")path=s.image_path;
 if(type==="video")path=s.video_path;
 if(type==="audio")path=s.audio_path;
 if(type==="voice")path=s.voice_path;

 if(!path){
  document.body.innerHTML="<div class='box' style='margin:30px'>Bu media mavjud emas.</div>";
  return;
 }

 const url=publicMedia(path);
 let media="";

 if(type==="image")
  media=`<img class="media" src="${esc(url)}">`;

 if(type==="video")
  media=`<video class="media" controls autoplay src="${esc(url)}"></video>`;

 if(type==="audio"||type==="voice")
  media=`<audio class="media" controls autoplay src="${esc(url)}"></audio>`;

 const link=mediaLink(token,type);

 document.body.innerHTML=`
 <div id="app">
  <div class="box" style="max-width:850px;margin:25px auto">
   <h1>${esc(s.title)}</h1>
   <div class="date">${dateText(s.created_at)}</div>
   <hr>
   ${media}
   <div class="linkbox" style="margin-top:15px">${esc(link)}</div>
   <button style="margin-top:8px" onclick="copyText('${esc(link)}')">Linkni nusxalash</button>
  </div>
 </div>`;
}

function handleUrl(){
 const p=new URLSearchParams(location.search);

 const quote=p.get("quote");
 const story=p.get("story");
 const media=p.get("media");
 const type=p.get("type");

 if(quote!==null){
  showQuoteOnly(Number(quote));
  return true;
 }

 if(story){
  publicStory(story);
  return true;
 }

 if(media&&type){
  publicMediaPage(media,type);
  return true;
 }

 return false;
}

sb.auth.onAuthStateChange(async(event,session)=>{
 if(event==="PASSWORD_RECOVERY"){
  currentUser=session?.user||null;
  app.innerHTML=`
  <div class="auth">
   <h2>Yangi parol</h2>
   <input id="newPass" type="password" placeholder="Yangi parol">
   <button style="width:100%" onclick="changePassword()">Saqlash</button>
  </div>`;
 }
});

async function changePassword(){
 const p=document.getElementById("newPass").value;
 if(p.length<6)return toast("Parol kamida 6 belgidan iborat bo‘lsin");

 const {error}=await sb.auth.updateUser({password:p});
 if(error)return toast(error.message);

 toast("Parol o‘zgartirildi");
 setTimeout(init,700);
}
