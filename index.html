<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Munisam hikoyalari</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  color:#fff;
  font-family:Arial,sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.72)),
    url("IMG_20260708_133902_971.jpg") center/cover fixed;
}
button,input,textarea{font:inherit}
button{
  cursor:pointer;
  border:0;
  border-radius:12px;
  padding:10px 15px;
  margin:4px;
  background:#fff;
  color:#111;
  font-weight:bold;
}
button:hover{opacity:.85}
input,textarea{
  width:100%;
  border:0;
  outline:none;
  border-radius:12px;
  padding:12px;
  margin:6px 0;
  background:rgba(255,255,255,.94);
  color:#111;
}
textarea{min-height:170px;resize:vertical}
.container{width:min(1100px,94%);margin:auto}
header{padding:28px 0 15px;text-align:center}
header h1{margin:0;font-size:34px}
header p{opacity:.85}
.card{
  background:rgba(0,0,0,.60);
  border:1px solid rgba(255,255,255,.18);
  border-radius:18px;
  padding:18px;
  margin:15px 0;
  backdrop-filter:blur(8px);
}
.story{
  background:rgba(255,255,255,.09);
  border-radius:15px;
  padding:15px;
  margin:10px 0;
}
.story h3{margin-top:0}
.meta{font-size:13px;opacity:.7}
.small{font-size:13px;opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.green{background:#15803d;color:#fff}
.danger{background:#b91c1c;color:#fff}
.dark{background:#222;color:#fff}
.blue{background:#2563eb;color:#fff}
.hidden{display:none!important}
.media{max-width:100%;max-height:430px;border-radius:12px;margin-top:10px}
video,audio{width:100%;margin-top:10px}
.reader-content{white-space:pre-wrap;line-height:1.75}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}
.modal-box{
  width:min(720px,100%);
  max-height:92vh;
  overflow:auto;
  background:#171717;
  border-radius:18px;
  padding:20px;
}
label{display:block;margin-top:10px;font-weight:bold}
hr{border:0;border-top:1px solid rgba(255,255,255,.15);margin:18px 0}
.status{text-align:center;padding:10px;min-height:20px}
.admin-badge{
  background:#7c3aed;color:#fff;padding:4px 8px;
  border-radius:8px;font-size:12px
}
.owner-badge{
  background:#0f766e;color:#fff;padding:4px 8px;
  border-radius:8px;font-size:12px
}
.media-link{
  display:block;word-break:break-all;
  font-size:12px;opacity:.8;margin:5px 0
}
.quote{font-style:italic;font-size:17px;line-height:1.6}
.empty{text-align:center;opacity:.7;padding:30px 10px}
.file-box{
  padding:10px;
  background:rgba(255,255,255,.07);
  border-radius:12px;
  margin:8px 0;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🌙 Munisam hikoyalari</h1>
  <p>Hikoyalarim, iqtiboslarim va xotiralarim</p>
</header>

<div id="status" class="status"></div>

<div id="authSection" class="card">
  <h2>🔐 Kirish</h2>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Parol">

  <div class="row">
    <button class="green" onclick="login()">Kirish</button>
    <button onclick="register()">Ro‘yxatdan o‘tish</button>
    <button class="dark" onclick="forgotPassword()">Parolni unutdim</button>
  </div>
</div>

<div id="userSection" class="card hidden">
  <div class="row">
    <strong id="userEmail"></strong>
    <span id="roleBadge"></span>
    <button class="dark" onclick="logout()">Chiqish</button>
  </div>
</div>

<div id="mainSection" class="hidden">

  <div class="card">
    <div class="row">
      <button class="green" onclick="newStory()">➕ Yangi hikoya</button>
      <button onclick="showQuotes()">💬 Iqtiboslar</button>
      <button onclick="loadStories()">🔄 Yangilash</button>
    </div>

    <input
      id="search"
      placeholder="🔎 Hikoya qidirish..."
      oninput="renderStories()"
    >
  </div>

  <div id="storyEditor" class="card hidden">

    <h2 id="editorTitle">✍️ Yangi hikoya</h2>

    <input id="storyTitle" placeholder="Hikoya nomi">

    <textarea
      id="storyContent"
      placeholder="Hikoyangizni yozing..."
    ></textarea>

    <label>
      <input id="isPublic" type="checkbox" style="width:auto">
      Hammaga ko‘rinsin
    </label>

    <label>🔒 Hikoya paroli</label>

    <input
      id="storyPassword"
      type="password"
      placeholder="Ixtiyoriy"
    >

    <div class="small">
      Tahrirlashda parolni bo‘sh qoldirsangiz,
      eski parol saqlanadi.
    </div>

    <hr>

    <div class="file-box">
      <h3>🖼 Rasm</h3>
      <input
        id="imageFile"
        type="file"
        accept="image/*"
        onchange="showFileName('imageFile','imageName')"
      >
      <div id="imageName" class="small"></div>
    </div>

    <div class="file-box">
      <h3>🎬 Video</h3>
      <input
        id="videoFile"
        type="file"
        accept="video/*"
        onchange="showFileName('videoFile','videoName')"
      >
      <div id="videoName" class="small"></div>
    </div>

    <div class="file-box">
      <h3>🎵 Audio</h3>
      <input
        id="audioFile"
        type="file"
        accept="audio/*"
        onchange="showFileName('audioFile','audioName')"
      >
      <div id="audioName" class="small"></div>
    </div>

    <div class="file-box">
      <h3>🎙 Ovoz yozish</h3>

      <div class="row">
        <button id="startVoiceBtn" onclick="startRecording()">
          🎙 Boshlash
        </button>

        <button
          id="stopVoiceBtn"
          class="danger hidden"
          onclick="stopRecording()"
        >
          ⏹ To‘xtatish
        </button>
      </div>

      <div id="recordStatus" class="small"></div>
    </div>

    <div class="row">
      <button class="green" onclick="saveStory()">💾 Saqlash</button>
      <button class="dark" onclick="cancelEdit()">Bekor qilish</button>
    </div>

  </div>

  <div id="stories"></div>

</div>

</div>

<div id="recoveryModal" class="modal hidden">
  <div class="modal-box">
    <h2>🔑 Yangi parol</h2>

    <input
      id="newPassword"
      type="password"
      placeholder="Yangi parol"
    >

    <button class="green" onclick="changePassword()">
      Parolni almashtirish
    </button>

    <button class="dark" onclick="closeRecovery()">
      Yopish
    </button>
  </div>
</div>

<div id="storyPasswordModal" class="modal hidden">
  <div class="modal-box">

    <h2>🔒 Hikoya parol bilan himoyalangan</h2>

    <input
      id="readerPassword"
      type="password"
      placeholder="Hikoya parolini kiriting"
    >

    <button class="green" onclick="verifyReaderPassword()">
      Ochish
    </button>

    <button class="dark" onclick="closeStoryPassword()">
      Bekor qilish
    </button>

  </div>
</div>

<div id="readerModal" class="modal hidden">
  <div class="modal-box">

    <button class="dark" onclick="closeReader()">✕ Yopish</button>

    <h2 id="readerTitle"></h2>

    <div id="readerDate" class="meta"></div>

    <hr>

    <div id="readerContent" class="reader-content"></div>

    <div id="readerMedia"></div>

  </div>
</div>

<div id="mediaModal" class="modal hidden">
  <div class="modal-box">

    <button class="dark" onclick="closeMedia()">✕ Yopish</button>

    <h2 id="mediaTitle"></h2>

    <div id="mediaDate" class="meta"></div>

    <hr>

    <div id="mediaOnlyContent"></div>

  </div>
</div>

<script>

const SUPABASE_URL =
"https://xponjbwjrbnonkuyhtzz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_DSnyIy3Xp3w_Yn1CwaheXA_Gl6-bFon";

const ADMIN_ID =
"d83107c5-ac1a-49bf-a53d-7fe17f39f15b";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      flowType:"pkce",
      detectSessionInUrl:true
    }
  }
);

let currentUser=null;
let stories=[];
let editingId=null;

let uploadedVoice=null;
let mediaRecorder=null;
let recordedChunks=[];

let pendingStory=null;
let pendingMediaType=null;

function status(message){
  document.getElementById("status").textContent=message||"";
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatDate(date){
  if(!date)return "";
  return new Date(date).toLocaleString(
    "uz-UZ",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );
}

function randomToken(){
  if(window.crypto?.randomUUID)
    return crypto.randomUUID();

  return Date.now().toString(36)+
    Math.random().toString(36).slice(2);
}

function getSiteUrl(){
  return window.location.origin+
    window.location.pathname;
}

async function register(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email||!password){
    status("Email va parolni kiriting.");
    return;
  }

  if(password.length<6){
    status("Parol kamida 6 ta belgidan iborat bo‘lsin.");
    return;
  }

  status("Ro‘yxatdan o‘tilmoqda...");

  const {error}=await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){
    status(error.message);
    return;
  }

  status("Ro‘yxatdan o‘tish muvaffaqiyatli. Emailingizni tekshiring.");
}

async function login(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email||!password){
    status("Email va parolni kiriting.");
    return;
  }

  status("Kirilmoqda...");

  const {data,error}=
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    status(error.message);
    return;
  }

  currentUser=data.user;
  updateAuthUI();
  await loadStories();

  status("Xush kelibsiz ❤️");
}

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser=null;
  stories=[];

  updateAuthUI();
  status("Tizimdan chiqildi.");
}

async function forgotPassword(){

  const email=document.getElementById("email").value.trim();

  if(!email){
    status("Avval emailingizni yozing.");
    return;
  }

  const {error}=
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {redirectTo:getSiteUrl()}
    );

  if(error){
    status(error.message);
    return;
  }

  status("Parolni tiklash havolasi emailingizga yuborildi.");
}

async function changePassword(){

  const password=
    document.getElementById("newPassword").value;

  if(password.length<6){
    status("Yangi parol kamida 6 ta belgi bo‘lsin.");
    return;
  }

  const {error}=
    await supabaseClient.auth.updateUser({password});

  if(error){
    status(error.message);
    return;
  }

  closeRecovery();
  status("Parol muvaffaqiyatli almashtirildi.");
}

function closeRecovery(){
  document.getElementById("recoveryModal")
    .classList.add("hidden");
}

function updateAuthUI(){

  const auth=document.getElementById("authSection");
  const user=document.getElementById("userSection");
  const main=document.getElementById("mainSection");

  if(currentUser){

    auth.classList.add("hidden");
    user.classList.remove("hidden");
    main.classList.remove("hidden");

    document.getElementById("userEmail")
      .textContent=currentUser.email||"";

    const badge=document.getElementById("roleBadge");

    if(currentUser.id===ADMIN_ID){
      badge.className="admin-badge";
      badge.textContent="👑 ADMIN";
    }else{
      badge.className="owner-badge";
      badge.textContent="👤 FOYDALANUVCHI";
    }

  }else{

    auth.classList.remove("hidden");
    user.classList.add("hidden");
    main.classList.add("hidden");

  }
}function newStory(){

  editingId=null;
  uploadedVoice=null;
  recordedChunks=[];

  document.getElementById("editorTitle").textContent=
    "✍️ Yangi hikoya";

  document.getElementById("storyTitle").value="";
  document.getElementById("storyContent").value="";
  document.getElementById("isPublic").checked=false;
  document.getElementById("storyPassword").value="";

  document.getElementById("imageFile").value="";
  document.getElementById("videoFile").value="";
  document.getElementById("audioFile").value="";

  document.getElementById("imageName").textContent="";
  document.getElementById("videoName").textContent="";
  document.getElementById("audioName").textContent="";
  document.getElementById("recordStatus").textContent="";

  document.getElementById("storyEditor")
    .classList.remove("hidden");
}

function cancelEdit(){
  editingId=null;
  document.getElementById("storyEditor")
    .classList.add("hidden");
}

function showFileName(inputId,nameId){

  const file=document.getElementById(inputId).files[0];

  document.getElementById(nameId).textContent=
    file ? "Tanlandi: "+file.name : "";
}

async function startRecording(){

  if(!navigator.mediaDevices||
     !navigator.mediaDevices.getUserMedia){

    status("Brauzer ovoz yozishni qo‘llab-quvvatlamaydi.");
    return;
  }

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    recordedChunks=[];

    mediaRecorder=new MediaRecorder(stream);

    mediaRecorder.ondataavailable=function(event){

      if(event.data.size>0)
        recordedChunks.push(event.data);

    };

    mediaRecorder.onstop=function(){

      const blob=new Blob(
        recordedChunks,
        {
          type:mediaRecorder.mimeType||"audio/webm"
        }
      );

      uploadedVoice=new File(
        [blob],
        "voice-"+Date.now()+".webm",
        {type:blob.type}
      );

      document.getElementById("recordStatus")
        .textContent="✅ Ovoz yozildi.";

      stream.getTracks().forEach(
        track=>track.stop()
      );
    };

    mediaRecorder.start();

    document.getElementById("startVoiceBtn")
      .classList.add("hidden");

    document.getElementById("stopVoiceBtn")
      .classList.remove("hidden");

    document.getElementById("recordStatus")
      .textContent="🔴 Ovoz yozilmoqda...";

  }catch(error){

    status("Mikrofonga ruxsat berilmadi.");

  }
}

function stopRecording(){

  if(mediaRecorder &&
     mediaRecorder.state!=="inactive"){

    mediaRecorder.stop();
  }

  document.getElementById("startVoiceBtn")
    .classList.remove("hidden");

  document.getElementById("stopVoiceBtn")
    .classList.add("hidden");
}

async function uploadMedia(file){

  if(!file||!currentUser)
    return null;

  const extension=
    file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "bin";

  const path=
    currentUser.id+
    "/"+
    Date.now()+
    "-"+
    Math.random().toString(36).slice(2)+
    "."+
    extension;

  const {error}=
    await supabaseClient.storage
      .from("story-media")
      .upload(
        path,
        file,
        {
          upsert:false,
          contentType:file.type||undefined
        }
      );

  if(error)throw error;

  return path;
}

function getMediaUrl(path){

  if(!path)return "";

  const {data}=
    supabaseClient.storage
      .from("story-media")
      .getPublicUrl(path);

  return data.publicUrl;
}

async function saveStory(){

  if(!currentUser){
    status("Avval tizimga kiring.");
    return;
  }

  const title=
    document.getElementById("storyTitle").value.trim();

  const content=
    document.getElementById("storyContent").value.trim();

  const isPublic=
    document.getElementById("isPublic").checked;

  const password=
    document.getElementById("storyPassword").value;

  if(!title){
    status("Hikoya nomini yozing.");
    return;
  }

  if(!content){
    status("Hikoya matnini yozing.");
    return;
  }

  status("Hikoya saqlanmoqda...");

  try{

    let imagePath=null;
    let videoPath=null;
    let audioPath=null;
    let voicePath=null;

    const imageFile=
      document.getElementById("imageFile").files[0];

    const videoFile=
      document.getElementById("videoFile").files[0];

    const audioFile=
      document.getElementById("audioFile").files[0];

    if(imageFile)
      imagePath=await uploadMedia(imageFile);

    if(videoFile)
      videoPath=await uploadMedia(videoFile);

    if(audioFile)
      audioPath=await uploadMedia(audioFile);

    if(uploadedVoice)
      voicePath=await uploadMedia(uploadedVoice);

    let passwordHash=null;

    if(password){

      const {data,error}=
        await supabaseClient.rpc(
          "hash_story_password",
          {p_password:password}
        );

      if(error)throw error;

      passwordHash=data;
    }

    if(editingId){

      const updateData={
        title,
        content,
        is_public:isPublic
      };

      if(password)
        updateData.story_password_hash=passwordHash;

      if(imagePath)
        updateData.image_path=imagePath;

      if(videoPath)
        updateData.video_path=videoPath;

      if(audioPath)
        updateData.audio_path=audioPath;

      if(voicePath)
        updateData.voice_path=voicePath;

      const {error}=
        await supabaseClient
          .from("stories")
          .update(updateData)
          .eq("id",editingId);

      if(error)throw error;

      status("Hikoya muvaffaqiyatli tahrirlandi.");

    }else{

      const insertData={
        title,
        content,
        owner_id:currentUser.id,
        is_public:isPublic,
        share_token:randomToken(),
        story_password_hash:passwordHash,
        image_path:imagePath,
        video_path:videoPath,
        audio_path:audioPath,
        voice_path:voicePath
      };

      const {error}=
        await supabaseClient
          .from("stories")
          .insert(insertData);

      if(error)throw error;

      status("Hikoya muvaffaqiyatli saqlandi.");
    }

    editingId=null;
    uploadedVoice=null;

    document.getElementById("storyEditor")
      .classList.add("hidden");

    await loadStories();

  }catch(error){

    console.error(error);
    status("Xatolik: "+error.message);

  }
}

async function loadStories(){

  if(!currentUser)return;

  status("Hikoyalar yuklanmoqda...");

  let query=
    supabaseClient
      .from("stories")
      .select("*")
      .order("created_at",{ascending:false});

  if(currentUser.id!==ADMIN_ID){

    query=query.eq(
      "owner_id",
      currentUser.id
    );
  }

  const {data,error}=await query;

  if(error){

    status("Xatolik: "+error.message);
    return;
  }

  stories=data||[];

  renderStories();
  status("");
}

function renderStories(){

  const box=document.getElementById("stories");

  const search=
    document.getElementById("search")
      .value.trim().toLowerCase();

  const list=stories.filter(story=>{

    if(!search)return true;

    return(
      String(story.title||"")
        .toLowerCase()
        .includes(search)||
      String(story.content||"")
        .toLowerCase()
        .includes(search)
    );
  });

  if(!list.length){

    box.innerHTML=
      '<div class="card empty">📖 Hozircha hikoya topilmadi.</div>';

    return;
  }

  box.innerHTML=
    list.map(story=>storyCard(story)).join("");
}

function storyCard(story){

  const canManage=
    currentUser &&
    (
      currentUser.id===ADMIN_ID ||
      currentUser.id===story.owner_id
    );

  const publicLink=
    story.share_token
      ? getSiteUrl()+
        "?story="+
        encodeURIComponent(story.share_token)
      : "";

  let mediaHtml="";

  if(story.image_path){

    mediaHtml+=
      '<img class="media" src="'+
      getMediaUrl(story.image_path)+
      '" alt="Rasm">';
  }

  if(story.video_path){

    mediaHtml+=
      '<video class="media" controls src="'+
      getMediaUrl(story.video_path)+
      '"></video>';
  }

  if(story.audio_path){

    mediaHtml+=
      '<audio controls src="'+
      getMediaUrl(story.audio_path)+
      '"></audio>';
  }

  if(story.voice_path){

    mediaHtml+=
      '<div class="small">🎙 Ovoz</div>'+
      '<audio controls src="'+
      getMediaUrl(story.voice_path)+
      '"></audio>';
  }

  let buttons=
    '<button onclick="readStory(\''+
    story.id+
    '\')">📖 O‘qish</button>';

  if(canManage){

    buttons+=
      '<button class="blue" onclick="editStory(\''+
      story.id+
      '\')">✏️ Tahrirlash</button>';

    buttons+=
      '<button class="danger" onclick="deleteStory(\''+
      story.id+
      '\')">🗑 O‘chirish</button>';
  }

  if(story.is_public){

    buttons+=
      '<button onclick="copyStoryLink(\''+
      story.share_token+
      '\')">🔗 Hikoya havolasi</button>';

    if(story.image_path)
      buttons+=
        '<button onclick="copyMediaLink(\''+
        story.share_token+
        '\',\'image\')">🖼 Rasm linki</button>';

    if(story.video_path)
      buttons+=
        '<button onclick="copyMediaLink(\''+
        story.share_token+
        '\',\'video\')">🎬 Video linki</button>';

    if(story.audio_path)
      buttons+=
        '<button onclick="copyMediaLink(\''+
        story.share_token+
        '\',\'audio\')">🎵 Audio linki</button>';

    if(story.voice_path)
      buttons+=
        '<button onclick="copyMediaLink(\''+
        story.share_token+
        '\',\'voice\')">🎙 Ovoz linki</button>';
  }

  return `
    <div class="story">

      <h3>${escapeHtml(story.title)}</h3>

      <div class="meta">
        ${formatDate(story.created_at)}
        · ${story.is_public?"🌍 Ochiq":"🔐 Yopiq"}
        ${story.story_password_hash?" · 🔒 Parolli":""}
      </div>

      ${
        currentUser.id===ADMIN_ID
        ? '<div class="small">👑 Admin</div>'
        : ''
      }

      <div class="reader-content">
        ${escapeHtml(
          String(story.content||"").slice(0,500)
        )}
        ${
          String(story.content||"").length>500
          ? "..."
          : ""
        }
      </div>

      ${mediaHtml}

      <div class="row">
        ${buttons}
      </div>

      ${
        story.is_public
        ? `
          <div class="small">🔗 Hikoya havolasi:</div>
          <div class="media-link">
            ${escapeHtml(publicLink)}
          </div>
        `
        : ""
      }

    </div>
  `;
}

function editStory(id){

  const story=stories.find(s=>s.id===id);

  if(!story)return;

  editingId=id;

  document.getElementById("editorTitle")
    .textContent="✏️ Hikoyani tahrirlash";

  document.getElementById("storyTitle")
    .value=story.title||"";

  document.getElementById("storyContent")
    .value=story.content||"";

  document.getElementById("isPublic")
    .checked=!!story.is_public;

  document.getElementById("storyPassword")
    .value="";

  document.getElementById("imageFile").value="";
  document.getElementById("videoFile").value="";
  document.getElementById("audioFile").value="";

  document.getElementById("imageName").textContent=
    story.image_path?"Eski rasm saqlangan":"";

  document.getElementById("videoName").textContent=
    story.video_path?"Eski video saqlangan":"";

  document.getElementById("audioName").textContent=
    story.audio_path?"Eski audio saqlangan":"";

  document.getElementById("storyEditor")
    .classList.remove("hidden");
  }async function deleteStory(id){

  const story=stories.find(s=>s.id===id);

  if(!story)return;

  if(!confirm(
    `"${story.title}" hikoyasini o‘chirishni xohlaysizmi?`
  ))return;

  status("Hikoya o‘chirilmoqda...");

  try{

    const paths=[
      story.image_path,
      story.video_path,
      story.audio_path,
      story.voice_path
    ].filter(Boolean);

    if(paths.length){

      await supabaseClient.storage
        .from("story-media")
        .remove(paths);
    }

    const {error}=
      await supabaseClient
        .from("stories")
        .delete()
        .eq("id",id);

    if(error)throw error;

    await loadStories();

    status("Hikoya o‘chirildi.");

  }catch(error){

    status("O‘chirishda xatolik: "+error.message);
  }
}

async function copyStoryLink(token){

  const link=
    getSiteUrl()+
    "?story="+
    encodeURIComponent(token);

  try{

    await navigator.clipboard.writeText(link);
    status("🔗 Hikoya havolasi nusxalandi.");

  }catch(error){

    prompt("Havolani nusxalang:",link);
  }
}

function getMediaShareLink(token,type){

  return(
    getSiteUrl()+
    "?media="+
    encodeURIComponent(token)+
    "&type="+
    encodeURIComponent(type)
  );
}

async function copyMediaLink(token,type){

  const link=getMediaShareLink(token,type);

  try{

    await navigator.clipboard.writeText(link);
    status("🔗 Media havolasi nusxalandi.");

  }catch(error){

    prompt("Havolani nusxalang:",link);
  }
}

function readStory(id){

  const story=stories.find(s=>s.id===id);

  if(!story)return;

  if(story.story_password_hash){

    pendingStory=story;
    pendingMediaType=null;

    document.getElementById("readerPassword").value="";

    document.getElementById("storyPasswordModal")
      .classList.remove("hidden");

    return;
  }

  openReader(story);
}

function openReader(story){

  document.getElementById("readerTitle")
    .textContent=story.title||"";

  document.getElementById("readerDate")
    .textContent=formatDate(story.created_at);

  document.getElementById("readerContent")
    .textContent=story.content||"";

  renderReaderMedia(story);

  document.getElementById("readerModal")
    .classList.remove("hidden");
}

function renderReaderMedia(story){

  const box=document.getElementById("readerMedia");

  let html="";

  if(story.image_path){

    html+=
      '<img class="media" src="'+
      getMediaUrl(story.image_path)+
      '" alt="Rasm">';
  }

  if(story.video_path){

    html+=
      '<video class="media" controls src="'+
      getMediaUrl(story.video_path)+
      '"></video>';
  }

  if(story.audio_path){

    html+=
      '<audio controls src="'+
      getMediaUrl(story.audio_path)+
      '"></audio>';
  }

  if(story.voice_path){

    html+=
      '<div class="small">🎙 Muallif ovozi</div>'+
      '<audio controls src="'+
      getMediaUrl(story.voice_path)+
      '"></audio>';
  }

  box.innerHTML=html;
}

function closeReader(){

  document.getElementById("readerModal")
    .classList.add("hidden");
}

function closeStoryPassword(){

  pendingStory=null;
  pendingMediaType=null;

  document.getElementById("storyPasswordModal")
    .classList.add("hidden");
}

async function verifyReaderPassword(){

  if(!pendingStory)return;

  const password=
    document.getElementById("readerPassword").value;

  if(!password){
    status("Parolni kiriting.");
    return;
  }

  const {data,error}=
    await supabaseClient.rpc(
      "verify_story_password",
      {
        p_token:pendingStory.share_token,
        p_password:password
      }
    );

  if(error){
    status(error.message);
    return;
  }

  if(!data||!data.length){

    status("Parol noto‘g‘ri.");
    return;
  }

  const story={
    ...pendingStory,
    ...data[0]
  };

  const mediaType=pendingMediaType;

  closeStoryPassword();
  status("");

  if(mediaType){

    showOnlyMedia(story,mediaType);

  }else{

    openReader(story);

  }
}

function showQuotes(){

  const quotes=[
    "Ba’zi odamlar ketmaydi, shunchaki hayotingda o‘rnini yo‘qotadi.",
    "Ba’zan sukut — aytilmagan eng baland gap.",
    "Ketgan odam emas, undan qolgan bo‘shliq og‘riydi.",
    "Ba’zi xotiralar tugamaydi, faqat odamlar ulardan uzoqlashadi.",
    "Va’dalar so‘z bilan beriladi, lekin insonning asl qiyofasi ularni bajarganda bilinadi."
  ];

  document.getElementById("stories").innerHTML=`

    <div class="card">

      <div class="row">
        <button class="dark" onclick="loadStories()">
          ← Hikoyalarga qaytish
        </button>
      </div>

      <h2>💬 Iqtiboslar</h2>

      ${
        quotes.map(q=>`
          <div class="story">
            <div class="quote">
              “${escapeHtml(q)}”
            </div>
          </div>
        `).join("")
      }

    </div>
  `;
}

async function openPublicStory(token){

  status("Hikoya ochilmoqda...");

  const {data,error}=
    await supabaseClient.rpc(
      "get_public_story",
      {p_token:token}
    );

  if(error){

    status("Xatolik: "+error.message);
    return;
  }

  if(!data||!data.length){

    status("Bunday ochiq hikoya topilmadi.");
    return;
  }

  const story=data[0];

  if(story.is_password_protected){

    pendingStory=story;
    pendingMediaType=null;

    document.getElementById("readerPassword").value="";

    document.getElementById("storyPasswordModal")
      .classList.remove("hidden");

    status("");

    return;
  }

  openReader(story);
  status("");
}

async function openPublicMedia(token,type){

  status("Media ochilmoqda...");

  const {data,error}=
    await supabaseClient.rpc(
      "get_public_story",
      {p_token:token}
    );

  if(error){

    status("Xatolik: "+error.message);
    return;
  }

  if(!data||!data.length){

    status("Bunday media topilmadi.");
    return;
  }

  const story=data[0];

  if(story.is_password_protected){

    pendingStory=story;
    pendingMediaType=type;

    document.getElementById("readerPassword").value="";

    document.getElementById("storyPasswordModal")
      .classList.remove("hidden");

    status("");

    return;
  }

  showOnlyMedia(story,type);
  status("");
}

function showOnlyMedia(story,type){

  document.getElementById("mediaTitle")
    .textContent=story.title||"";

  document.getElementById("mediaDate")
    .textContent=formatDate(story.created_at);

  const box=
    document.getElementById("mediaOnlyContent");

  let path=null;

  if(type==="image")
    path=story.image_path;

  if(type==="video")
    path=story.video_path;

  if(type==="audio")
    path=story.audio_path;

  if(type==="voice")
    path=story.voice_path;

  if(!path){

    box.innerHTML=
      '<div class="empty">Media topilmadi.</div>';

  }else{

    const url=getMediaUrl(path);

    if(type==="image"){

      box.innerHTML=
        '<img class="media" src="'+
        url+
        '" alt="Rasm">';

    }else{

      box.innerHTML=
        '<'+
        (type==="video"?"video":"audio")+
        ' class="'+
        (type==="video"?"media":"")+
        '" controls src="'+
        url+
        '"></'+
        (type==="video"?"video":"audio")+'>';

    }
  }

  document.getElementById("mediaModal")
    .classList.remove("hidden");
}

function closeMedia(){

  document.getElementById("mediaModal")
    .classList.add("hidden");
  }async function checkUser(){

  const {data}=await supabaseClient.auth.getSession();

  currentUser=
    data.session
      ? data.session.user
      : null;

  updateAuthUI();

  if(currentUser)
    await loadStories();
}

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    currentUser=
      session
        ? session.user
        : null;

    updateAuthUI();

    if(currentUser)
      await loadStories();
  }
);

document.addEventListener(
  "keydown",
  function(event){

    if(event.key!=="Escape")
      return;

    document.getElementById("readerModal")
      .classList.add("hidden");

    document.getElementById("mediaModal")
      .classList.add("hidden");

    document.getElementById("storyPasswordModal")
      .classList.add("hidden");

    document.getElementById("recoveryModal")
      .classList.add("hidden");
  }
);

async function handleInitialUrl(){

  const params=
    new URLSearchParams(
      window.location.search
    );

  const storyToken=params.get("story");
  const mediaToken=params.get("media");
  const mediaType=params.get("type");

  if(mediaToken&&mediaType){

    await openPublicMedia(
      mediaToken,
      mediaType
    );

    return;
  }

  if(storyToken){

    await openPublicStory(
      storyToken
    );
  }
}

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    await checkUser();

    const hash=window.location.hash;

    if(hash.includes("type=recovery")){

      document.getElementById("recoveryModal")
        .classList.remove("hidden");
    }

    await handleInitialUrl();
  }
);

</script>
